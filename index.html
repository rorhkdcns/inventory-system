  <script>
    const COL_MAX = { A: 6, B: 6, C: 20 };

    // Supabase 초기화
    const SUPABASE_URL = 'https://ibdklbgmkiymqqscpoeu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImliZGtsYmdta2l5bXFxc2Nwb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMzU3MTEsImV4cCI6MjA5NzkxMTcxMX0.oQxJj_wsUAYaEIs4G0xzPszBiv8mplU-vea_Nnq9r1Q';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 디버깅용: Supabase 호출 결과를 콘솔에 출력 (F12 > Console 탭에서 확인)
    function logSb(op, table, error, payload) {
      if (error) {
        console.error(`[Supabase] ${table} ${op} 실패`, error, payload !== undefined ? { payload } : '');
      } else {
        console.log(`[Supabase] ${table} ${op} 성공`, payload !== undefined ? payload : '');
      }
    }

    // 초기 데이터 (seedInitialData / resetData 에서만 사용)
    const initialData = {
      A: {1:{2:[{n:'매직1제',q:24,d:'2024-01-01'},{n:'산화제',q:36,d:'2024-01-02'}]},2:{1:[{n:'산화제',q:8,d:'2024-01-03'}],2:[{n:'7/33',q:5,d:'2024-01-04'}],3:[{n:'5/30',q:22,d:'2024-01-05'}]},3:{2:[{n:'8/33',q:18,d:'2024-01-06'}],3:[{n:'매직1제',q:24,d:'2024-01-07'}]},4:{3:[{n:'10/45',q:12,d:'2024-01-08'}]},5:{1:[{n:'8/30',q:17,d:'2024-01-09'}],2:[{n:'3/0',q:20,d:'2024-01-10'}],3:[{n:'산화제',q:36,d:'2024-01-11'}]},6:{3:[{n:'산화제',q:54,d:'2024-01-12'}]}},
      B: {1:{2:[{n:'5/45',q:19,d:'2024-01-13'}]},2:{1:[{n:'매직1제',q:6,d:'2024-01-14'}],2:[{n:'8/1',q:3,d:'2024-01-15'}],3:[{n:'9/30',q:16,d:'2024-01-16'}]},3:{1:[{n:'6/30',q:16,d:'2024-01-17'}],2:[{n:'6/33',q:19,d:'2024-01-18'}],3:[{n:'02/02',q:18,d:'2024-01-19'}]},4:{1:[{n:'6/33',q:7,d:'2024-01-20'}],2:[{n:'10/30',q:7,d:'2024-01-21'}]},5:{1:[{n:'1/0',q:22,d:'2024-01-22'}],2:[{n:'3/0',q:14,d:'2024-01-23'}],3:[{n:'산화제',q:36,d:'2024-01-24'}]},6:{3:[{n:'7/30',q:11,d:'2024-01-25'}]}},
      C: {1:{2:[{n:'크림',q:7,d:'2024-01-26'}]},2:{2:[{n:'크림',q:24,d:'2024-01-27'}]},4:{1:[{n:'8/34',q:4,d:'2024-01-28'}],2:[{n:'산화제',q:72,d:'2024-01-29'}]},5:{1:[{n:'산화제',q:36,d:'2024-01-30'}],2:[{n:'산화제',q:36,d:'2024-01-31'}]},6:{1:[{n:'6/30',q:5,d:'2024-02-01'}]}}
    };

    // ===== 수량(소수점 두 자리) 유틸 =====
    // 부동소수점 오차(0.1 + 0.2 = 0.30000000000000004) 방지를 위해
    // 모든 계산 결과는 roundQty로 소수 둘째 자리까지 반올림한다.
    function roundQty(n) {
      const v = Number(n);
      if (!isFinite(v)) return 0;
      return Math.round((v + Number.EPSILON) * 100) / 100;
    }
    // 화면 표시용: 항상 소수점 두 자리 (24 -> "24.00", 3.5 -> "3.50")
    function fmtQty(n) {
      return roundQty(n).toFixed(2);
    }
    // 천 단위 구분 + 소수점 두 자리 (통계 합계용)
    function fmtQtyComma(n) {
      return roundQty(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    // 입력칸 값 읽기: 비었거나 0 이하면 null
    function readQtyInput(id) {
      return parseQtyValue(document.getElementById(id).value);
    }
    function parseQtyValue(raw) {
      if (raw === '' || raw === null || raw === undefined) return null;
      const v = roundQty(parseFloat(raw));
      if (!isFinite(v) || v <= 0) return null;
      return v;
    }
    // 엑셀 수량 열에 소수점 두 자리 서식 적용
    function applyQtyFormat(ws, colLetter, rowCount) {
      for (let r = 2; r <= rowCount; r++) {
        const cell = ws[colLetter + r];
        if (cell && typeof cell.v === 'number') cell.z = '0.00';
      }
    }

    let inv = { A: {}, B: {}, C: {} };
    let logs = [];
    let shippingSheet = [];
    let shippingSheetError = null;
    let editingItem = null;
    let editingCan = null;
    let statsSortDir = 'desc';
    let monthlySortDir = 'desc';
    let logTypeFilter = 'all';
    let logSortDir = 'desc';

    function toggleStatsSortDir() {
      statsSortDir = statsSortDir === 'desc' ? 'asc' : 'desc';
      renderStats();
    }

    function toggleMonthlySortDir() {
      monthlySortDir = monthlySortDir === 'desc' ? 'asc' : 'desc';
      renderMonthlyStats();
    }

    function flattenInitialData() {
      const rows = [];
      Object.entries(initialData).forEach(([col, cans]) => {
        Object.entries(cans).forEach(([can, floors]) => {
          Object.entries(floors).forEach(([floor, items]) => {
            items.forEach(it => rows.push({ col, can: parseInt(can), floor: parseInt(floor), name: it.n, qty: it.q, in_date: it.d }));
          });
        });
      });
      return rows;
    }

    let invReqSeq = 0;
    async function loadInventory() {
      const seq = ++invReqSeq;
      console.log('[Supabase] inventory_items select 요청 중...');
      const { data: rows, error } = await sb.from('inventory_items').select('*');
      logSb('select', 'inventory_items', error, rows);
      if (error) { alert('재고 불러오기 오류: ' + error.message); return; }
      if (seq !== invReqSeq) return; // 이후에 시작된 더 최신 요청이 있으면 이 응답(구버전)은 버림
      const next = { A: {}, B: {}, C: {} };
      rows.forEach(row => {
        const { id, col, can, floor, name, qty, in_date, exp_date } = row;
        if (!next[col]) next[col] = {};
        if (!next[col][can]) next[col][can] = {};
        if (!next[col][can][floor]) next[col][can][floor] = [];
        next[col][can][floor].push({ id, n: name, q: roundQty(qty), d: in_date, e: exp_date });
      });
      inv = next;
    }

    async function loadLogs() {
      console.log('[Supabase] inventory_logs select 요청 중...');
      const { data: rows, error } = await sb.from('inventory_logs').select('*').order('id', { ascending: true });
      logSb('select', 'inventory_logs', error, rows);
      if (error) { alert('로그 불러오기 오류: ' + error.message); return; }
      logs = rows.map(r => ({ id: r.id, type: r.type, col: r.col, can: r.can, floor: r.floor, name: r.name, qty: roundQty(r.qty), date: r.date, fromCol: r.from_col, fromCan: r.from_can, fromFloor: r.from_floor }));
    }

    // 출고표 정렬: 열(A->B->C) -> 칸 번호(숫자순) -> 층(1->2->3) -> 등록순
    function sortShippingRows(rows) {
      return rows.slice().sort((a, b) =>
        String(a.col).localeCompare(String(b.col)) ||
        (Number(a.can) - Number(b.can)) ||
        (Number(a.floor) - Number(b.floor)) ||
        (Number(a.id) - Number(b.id))
      );
    }

    async function loadShippingSheet() {
      console.log('[Supabase] shipping_sheet select 요청 중...');
      const { data: rows, error } = await sb.from('shipping_sheet').select('*');
      logSb('select', 'shipping_sheet', error, rows);
      if (error) {
        // shipping_sheet 테이블을 아직 만들지 않았을 수도 있으므로 alert 대신
        // 출고표 탭 안에 안내 문구만 보여준다.
        shippingSheetError = error.message;
        shippingSheet = [];
        return;
      }
      shippingSheetError = null;
      shippingSheet = sortShippingRows((rows || []).map(r => ({ ...r, qty: roundQty(r.qty) })));
    }

    function subscribeRealtime() {
      sb.channel('inventory-items-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'inventory_items' }, async (payload) => {
          console.log('[Realtime] inventory_items 변경 감지:', payload);
          await loadInventory();
          render();
          renderShipSearch();
          if (!photoBusy) renderPhotoReview();
        })
        .subscribe((status) => console.log('[Realtime] inventory_items 채널 상태:', status));

      sb.channel('inventory-logs-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'inventory_logs' }, async (payload) => {
          console.log('[Realtime] inventory_logs 변경 감지:', payload);
          await loadLogs();
          renderLogs();
        })
        .subscribe((status) => console.log('[Realtime] inventory_logs 채널 상태:', status));

      sb.channel('shipping-sheet-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'shipping_sheet' }, async (payload) => {
          console.log('[Realtime] shipping_sheet 변경 감지:', payload);
          await loadShippingSheet();
          renderShippingSheet();
        })
        .subscribe((status) => console.log('[Realtime] shipping_sheet 채널 상태:', status));
    }

    function showTab(name, btn) {
      document.querySelectorAll('.panel').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(name).classList.add('active');
      btn.classList.add('active');
      if (name === 'stats') { renderStats(); renderMonthlyStats(); }
      if (name === 'logs') renderLogs();
      if (name === 'ship') renderShippingSheet();
    }

    function getTodayDate() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function getAllFloors() {
      const floors = new Set();
      ['A', 'B', 'C'].forEach(col => {
        for (let can = 1; can <= 20; can++) {
          if (inv[col][can]) {
            Object.keys(inv[col][can]).forEach(f => floors.add(parseInt(f)));
          }
        }
      });
      return Array.from(floors).sort((a, b) => a - b);
    }

    function setEditMode() {
      document.getElementById('editFields').style.display = 'block';
      document.getElementById('editButtons').style.display = 'block';
      document.getElementById('addSection').style.display = 'block';
      document.getElementById('inSection').style.display = 'none';
      document.getElementById('outSection').style.display = 'none';
      document.getElementById('shipSection').style.display = 'none';
      document.getElementById('moveSection').style.display = 'none';
    }

    function openEditModal(col, can, floor, idx) {
      const item = inv[col][can][floor][idx];
      editingItem = { col, can, floor, idx, id: item.id };
      editingCan = { col, can };
      document.getElementById('modalTitle').textContent = `${col}열 칸${can} 상품 수정`;
      document.getElementById('modalName').value = item.n;
      document.getElementById('modalQty').value = fmtQty(item.q);
      document.getElementById('modalDate').value = item.d || getTodayDate();
      document.getElementById('modalExpDate').value = item.e || '';
      setEditMode();

      const floors = getAllFloors();
      const maxF = Math.max(...floors, 3, floor);
      const fs = document.getElementById('modalFloor');
      fs.innerHTML = '';
      for (let i = 1; i <= maxF; i++) {
        const o = document.createElement('option'); o.value = i; o.textContent = i + '층'; fs.appendChild(o);
      }
      fs.value = floor;

      const nfs = document.getElementById('newFloor');
      nfs.innerHTML = '';
      for (let i = 1; i <= Math.max(...floors, 3); i++) {
        const o = document.createElement('option'); o.value = i; o.textContent = i + '층'; nfs.appendChild(o);
      }
      document.getElementById('newName').value = '';
      document.getElementById('newQty').value = '';
      document.getElementById('newDate').value = '';
      document.getElementById('newExpDate').value = '';

      openModalUI();
    }

    function openAddModal(col, can) {
      editingItem = null;
      editingCan = { col, can };
      document.getElementById('modalTitle').textContent = `${col}열 칸${can} 상품 추가`;
      document.getElementById('editFields').style.display = 'none';
      document.getElementById('editButtons').style.display = 'none';
      document.getElementById('addSection').style.display = 'block';
      document.getElementById('inSection').style.display = 'none';
      document.getElementById('outSection').style.display = 'none';
      document.getElementById('shipSection').style.display = 'none';
      document.getElementById('moveSection').style.display = 'none';

      const floors = getAllFloors();
      const nfs = document.getElementById('newFloor');
      nfs.innerHTML = '';
      for (let i = 1; i <= Math.max(...floors, 3); i++) {
        const o = document.createElement('option'); o.value = i; o.textContent = i + '층'; nfs.appendChild(o);
      }
      document.getElementById('newName').value = '';
      document.getElementById('newQty').value = '';
      document.getElementById('newDate').value = '';
      document.getElementById('newExpDate').value = '';
      openModalUI();
    }

    function openAddModalFloor(col, can, floor) {
      openAddModal(col, can);
      document.getElementById('newFloor').value = floor;
    }

    // 모달 안에서 한 섹션만 보여준다 (입고/출고/이동/출고표입력 공통)
    function showOnlySection(sectionId) {
      document.getElementById('editFields').style.display = 'none';
      document.getElementById('editButtons').style.display = 'none';
      document.getElementById('addSection').style.display = 'none';
      ['inSection', 'outSection', 'shipSection', 'moveSection'].forEach(id => {
        document.getElementById(id).style.display = id === sectionId ? 'block' : 'none';
      });
    }

    function getEditingItem() {
      if (!editingItem) return null;
      const { col, can, floor, idx } = editingItem;
      return (inv[col] && inv[col][can] && inv[col][can][floor] && inv[col][can][floor][idx]) || null;
    }

    function showInModal() {
      showOnlySection('inSection');
      document.getElementById('inQty').value = '';
      document.getElementById('inDate').value = '';
      document.getElementById('inExpDate').value = '';
    }

    function cancelIn() {
      setEditMode();
    }

    async function confirmIn() {
      if (!editingItem) return;
      const qty = readQtyInput('inQty');
      if (qty === null) return alert('수량을 0보다 큰 숫자로 입력해주세요 (소수점 두 자리까지)');
      const { col, can, floor, idx, id } = editingItem;
      const date = document.getElementById('inDate').value || getTodayDate();
      const expDate = document.getElementById('inExpDate').value;
      const item = inv[col][can][floor][idx];
      const newQty = roundQty(item.q + qty);

      const updatePayload = { qty: newQty, in_date: date };
      if (expDate) updatePayload.exp_date = expDate;
      const { error: updErr } = await sb.from('inventory_items').update(updatePayload).eq('id', id);
      logSb('update', 'inventory_items', updErr, { id, ...updatePayload });
      if (updErr) { console.error('[Supabase] 입고 실패:', updErr); return alert('입고 오류: ' + updErr.message); }

      const logPayload = { type: '입고', col, can, floor, name: item.n, qty, date };
      const { error: logErr } = await sb.from('inventory_logs').insert(logPayload);
      logSb('insert', 'inventory_logs', logErr, logPayload);
      if (logErr) { console.error('[Supabase] 입고 로그 저장 실패:', logErr); return alert('로그 저장 오류: ' + logErr.message); }

      await loadInventory();
      await loadLogs();
      render();
      closeModal();
      alert('입고되었습니다!');
    }

    function showMoveModal() {
      if (!editingItem) return;
      showOnlySection('moveSection');

      const { col, can, floor } = editingItem;
      const mc = document.getElementById('moveCol');
      mc.innerHTML = ['A', 'B', 'C'].map(c => `<option value="${c}">${c}열</option>`).join('');
      mc.value = col;

      updateMoveCanOptions();
      document.getElementById('moveCan').value = can;

      const floors = getAllFloors();
      const maxF = Math.max(...floors, 3, floor);
      const mf = document.getElementById('moveFloor');
      mf.innerHTML = '';
      for (let i = 1; i <= maxF; i++) {
        const o = document.createElement('option'); o.value = i; o.textContent = i + '층'; mf.appendChild(o);
      }
      mf.value = floor;
    }

    function updateMoveCanOptions() {
      const col = document.getElementById('moveCol').value;
      const maxCan = COL_MAX[col];
      const sel = document.getElementById('moveCan');
      const keep = parseInt(sel.value);
      sel.innerHTML = '';
      for (let i = 1; i <= maxCan; i++) {
        const o = document.createElement('option'); o.value = i; o.textContent = i + '칸'; sel.appendChild(o);
      }
      if (keep && keep <= maxCan) sel.value = keep;
    }

    function cancelMove() {
      setEditMode();
    }

    async function confirmMove() {
      if (!editingItem) return;
      const { col: fromCol, can: fromCan, floor: fromFloor, idx, id } = editingItem;
      const item = inv[fromCol][fromCan][fromFloor][idx];

      const toCol = document.getElementById('moveCol').value;
      const toCan = parseInt(document.getElementById('moveCan').value);
      const toFloor = parseInt(document.getElementById('moveFloor').value);

      if (!toCan || !toFloor || toFloor < 1) return alert('올바른 위치를 선택해주세요');
      if (toCol === fromCol && toCan === fromCan && toFloor === fromFloor) return alert('같은 위치로는 이동할 수 없습니다');

      const destItems = (inv[toCol] && inv[toCol][toCan] && inv[toCol][toCan][toFloor]) || [];
      const existing = destItems.find(d => d.n === item.n);

      let merge = false;
      if (existing) {
        merge = confirm(`이동할 위치에 이미 "${item.n}"이(가) 있습니다. 수량을 합칠까요?\n(확인: 합치기 / 취소: 별도 항목으로 유지)`);
      }

      if (merge) {
        const mergedQty = roundQty(existing.q + item.q);
        const { error: updErr } = await sb.from('inventory_items').update({ qty: mergedQty }).eq('id', existing.id);
        logSb('update', 'inventory_items', updErr, { id: existing.id, qty: mergedQty });
        if (updErr) return alert('이동 오류: ' + updErr.message);

        const { error: delErr } = await sb.from('inventory_items').delete().eq('id', id);
        logSb('delete', 'inventory_items', delErr, { id });
        if (delErr) return alert('이동 오류: ' + delErr.message);
      } else {
        const { error: updErr } = await sb.from('inventory_items').update({ col: toCol, can: toCan, floor: toFloor }).eq('id', id);
        logSb('update', 'inventory_items', updErr, { id, col: toCol, can: toCan, floor: toFloor });
        if (updErr) return alert('이동 오류: ' + updErr.message);
      }

      const logPayload = { type: '이동', col: toCol, can: toCan, floor: toFloor, name: item.n, qty: item.q, date: getTodayDate(), from_col: fromCol, from_can: fromCan, from_floor: fromFloor };
      const { error: logErr } = await sb.from('inventory_logs').insert(logPayload);
      logSb('insert', 'inventory_logs', logErr, logPayload);
      if (logErr) return alert('로그 저장 오류: ' + logErr.message);

      await loadInventory();
      await loadLogs();
      render();
      closeModal();
      alert('이동되었습니다!');
    }

    // 출고 공통 처리: 재고 차감(차감 후 0이면 상품 삭제) + '출고' 로그 기록
    // 일반 출고와 출고표입력이 똑같은 규칙을 쓰도록 한 곳에 모아 둔다.
    // loc: { col, can, floor, id } (생략하면 모달에서 선택한 상품)
    async function applyOutflow(item, qty, loc = editingItem) {
      const { col, can, floor, id } = loc;
      const today = getTodayDate();
      const newQty = roundQty(item.q - qty);
      const depleted = newQty <= 0;

      if (depleted) {
        const { error } = await sb.from('inventory_items').delete().eq('id', id);
        logSb('delete', 'inventory_items', error, { id });
        if (error) return { error, depleted };
      } else {
        const { error } = await sb.from('inventory_items').update({ qty: newQty }).eq('id', id);
        logSb('update', 'inventory_items', error, { id, qty: newQty });
        if (error) return { error, depleted };
      }

      const logPayload = { type: '출고', col, can, floor, name: item.n, qty, date: today };
      const { error: logErr } = await sb.from('inventory_logs').insert(logPayload);
      logSb('insert', 'inventory_logs', logErr, logPayload);
      return { error: null, depleted, logErr };
    }

    function showOutModal() {
      const item = getEditingItem();
      if (!item) return;
      showOnlySection('outSection');
      document.getElementById('outStockInfo').textContent = `현재 재고: ${fmtQty(item.q)}개`;
      document.getElementById('outQty').value = '';
    }

    function cancelOut() {
      setEditMode();
    }

    async function confirmOut() {
      const item = getEditingItem();
      if (!item) return;
      const qty = readQtyInput('outQty');
      if (qty === null) return alert('출고 수량을 0보다 큰 숫자로 입력해주세요 (소수점 두 자리까지)');
      if (qty > item.q) return alert(`재고가 부족합니다 (현재 재고 ${fmtQty(item.q)}개)`);

      const { error, depleted, logErr } = await applyOutflow(item, qty);
      if (error) { console.error('[Supabase] 출고 실패:', error); return alert('출고 오류: ' + error.message); }

      // 재고 변경(update/delete)은 이미 성공했으므로, 로그 저장 성공 여부와 무관하게
      // 화면은 항상 최신 DB 상태로 갱신한다 (delete 완료 → loadInventory 완료 → render 순서 유지).
      await loadInventory();
      await loadLogs();
      render();
      closeModal();

      if (logErr) { console.error('[Supabase] 출고 로그 저장 실패:', logErr); return alert('로그 저장 오류: ' + logErr.message); }
      alert(depleted ? '출고되었습니다! (재고 소진으로 삭제됨)' : '출고되었습니다!');
    }

    function showShipModal() {
      const item = getEditingItem();
      if (!item) return;
      showOnlySection('shipSection');
      document.getElementById('shipStockInfo').textContent = `현재 재고: ${fmtQty(item.q)}개`;
      document.getElementById('shipQty').value = '';
    }

    function cancelShip() {
      setEditMode();
    }

    async function confirmShip() {
      const item = getEditingItem();
      if (!item) return;
      const qty = readQtyInput('shipQty');
      if (qty === null) return alert('출고표 수량을 0보다 큰 숫자로 입력해주세요 (소수점 두 자리까지)');
      if (qty > item.q) return alert(`재고가 부족합니다 (현재 재고 ${fmtQty(item.q)}개)`);

      const { col, can, floor, id } = editingItem;
      const result = await addToShippingSheet(item, qty, { col, can, floor, id });
      if (result.shipErr) return;
      closeModal();
      alertShipResult(result);
    }

    // 출고표입력 공통 처리 (모달 "출고표입력"과 출고표 탭 검색 추가가 같이 쓴다)
    // 출고표 기록 → 재고 차감(0이면 상품 삭제) → '출고' 로그 → 화면 갱신
    async function addToShippingSheet(item, qty, loc) {
      const { col, can, floor } = loc;

      // 1) 출고표에 먼저 기록한다. (재고가 0이 되어 상품이 삭제되어도 출고표 기록은 남아야 함)
      const shipPayload = { col, can, floor, name: item.n, qty, date: getTodayDate() };
      const { error: shipErr } = await sb.from('shipping_sheet').insert(shipPayload);
      logSb('insert', 'shipping_sheet', shipErr, shipPayload);
      if (shipErr) { console.error('[Supabase] 출고표 기록 실패:', shipErr); alert('출고표 기록 오류: ' + shipErr.message); return { shipErr }; }

      // 2) 재고 차감 + '출고' 로그 (기존 출고와 동일한 처리)
      const { error, depleted, logErr } = await applyOutflow(item, qty, loc);
      if (error) console.error('[Supabase] 출고표 등록 중 재고 차감 실패:', error);

      await loadInventory();
      await loadLogs();
      await loadShippingSheet();
      render();
      renderShippingSheet();
      renderShipSearch();
      return { error, depleted, logErr };
    }

    function alertShipResult({ error, depleted, logErr }) {
      if (error) return alert('출고표에는 기록됐지만 재고 차감에 실패했습니다: ' + error.message);
      if (logErr) { console.error('[Supabase] 출고표 출고 로그 저장 실패:', logErr); return alert('로그 저장 오류: ' + logErr.message); }
      alert(depleted ? '출고표에 등록되었습니다! (재고 소진으로 상품 삭제됨)' : '출고표에 등록되었습니다!');
    }

    let modalHistoryPushed = false;

    function openModalUI() {
      document.getElementById('editModal').classList.add('active');
      history.pushState({ appModal: true }, '');
      modalHistoryPushed = true;
    }

    function closeModal() {
      const wasActive = document.getElementById('editModal').classList.contains('active');
      document.getElementById('editModal').classList.remove('active');
      editingItem = null;
      editingCan = null;
      if (wasActive && modalHistoryPushed) {
        modalHistoryPushed = false;
        history.back();
      }
    }

    window.addEventListener('popstate', () => {
      if (document.getElementById('editModal').classList.contains('active')) {
        modalHistoryPushed = false;
        document.getElementById('editModal').classList.remove('active');
        editingItem = null;
        editingCan = null;
      }
    });

    async function saveItem() {
      if (!editingItem) return;
      const floor = parseInt(document.getElementById('modalFloor').value);
      const name = document.getElementById('modalName').value.trim();
      const qty = readQtyInput('modalQty');
      const date = document.getElementById('modalDate').value || getTodayDate();
      const expDate = document.getElementById('modalExpDate').value || null;
      if (!name) return alert('상품명을 입력해주세요');
      if (qty === null) return alert('수량을 0보다 큰 숫자로 입력해주세요 (소수점 두 자리까지)');
      const { id } = editingItem;

      const updatePayload = { floor, name, qty, in_date: date, exp_date: expDate };
      const { error } = await sb.from('inventory_items').update(updatePayload).eq('id', id);
      logSb('update', 'inventory_items', error, { id, ...updatePayload });
      if (error) { console.error('[Supabase] 상품 수정 실패:', error); return alert('저장 오류: ' + error.message); }

      await loadInventory();
      render();
      closeModal();
    }

    async function addNewItem() {
      if (!editingCan) return;
      const floor = parseInt(document.getElementById('newFloor').value);
      const name = document.getElementById('newName').value.trim();
      const qty = readQtyInput('newQty');
      const date = document.getElementById('newDate').value || getTodayDate();
      const expDate = document.getElementById('newExpDate').value || null;
      if (!name) return alert('상품명을 입력해주세요');
      if (qty === null) return alert('수량을 0보다 큰 숫자로 입력해주세요 (소수점 두 자리까지)');
      const { col, can } = editingCan;

      const insertPayload = { col, can, floor, name, qty, in_date: date, exp_date: expDate };
      const { error } = await sb.from('inventory_items').insert(insertPayload);
      logSb('insert', 'inventory_items', error, insertPayload);
      if (error) { console.error('[Supabase] 상품 추가 실패:', error); return alert('추가 오류: ' + error.message); }

      await loadInventory();
      render();
      closeModal();
    }

    async function deleteItem() {
      if (!editingItem || !confirm('삭제하시겠어요?')) return;
      const { error } = await sb.from('inventory_items').delete().eq('id', editingItem.id);
      logSb('delete', 'inventory_items', error, { id: editingItem.id });
      if (error) { console.error('[Supabase] 상품 삭제 실패:', error); return alert('삭제 오류: ' + error.message); }
      await loadInventory();
      render();
      closeModal();
    }

    const FLOOR_COLORS = ['#7F77DD', '#1D9E75', '#D4537E'];
    function getFloorColor(floor) {
      return FLOOR_COLORS[(floor - 1) % FLOOR_COLORS.length];
    }

    function render() {
      let html = '';
      const allFloors = getAllFloors();
      const displayFloors = allFloors.length > 0 ? allFloors : [1, 2, 3];

      ['A', 'B', 'C'].forEach(col => {
        let colHtml = `<div class="col-wrapper"><div class="col-header">${col}열</div><div class="cans-list">`;
        const maxCan = COL_MAX[col];
        for (let can = 1; can <= maxCan; can++) {
          const cd = inv[col][can];
          let rowsHtml = '';
          displayFloors.forEach(floor => {
            if (cd && cd[floor] && cd[floor].length > 0) {
              cd[floor].forEach((it, idx) => {
                const dateHtml = it.d ? ` <span class="fl-date">[${it.d}]</span>` : '';
                const expHtml = it.e ? `<div class="fl-exp">유통기한: ${it.e}</div>` : '';
                rowsHtml += `<div class="floor-line" onclick="openEditModal('${col}',${can},${floor},${idx})">
                  <span class="fl-floor" style="color:${getFloorColor(floor)};">${floor}층</span>
                  <div class="fl-name-col">
                    <span class="fl-name">${it.n}${dateHtml}</span>
                    ${expHtml}
                  </div>
                  <span class="fl-qty">${fmtQty(it.q)}개</span>
                </div>`;
              });
            } else {
              rowsHtml += `<div class="floor-line" onclick="openAddModalFloor('${col}',${can},${floor})">
                <span class="fl-floor" style="color:${getFloorColor(floor)};">${floor}층</span>
                <div class="fl-name-col"><span class="fl-name fl-empty">+ 추가</span></div>
                <span class="fl-qty fl-empty">-</span>
              </div>`;
            }
          });
          colHtml += `<div class="can-island"><div class="can-num">${col}${can}칸</div><div class="can-box">${rowsHtml}</div></div>`;
        }
        colHtml += `</div></div>`;
        html += colHtml;
      });

      document.getElementById('cols-container').innerHTML = html;
    }

    function getProductTotals() {
      const prod = {};
      let tot = 0;
      ['A','B','C'].forEach(col => {
        for (let c = 1; c <= 20; c++) {
          if (inv[col][c]) {
            for (let f = 1; f <= 10; f++) {
              if (inv[col][c][f]) {
                inv[col][c][f].forEach((it, idx) => {
                  if (!prod[it.n]) prod[it.n] = { qty: 0, locations: [] };
                  prod[it.n].qty = roundQty(prod[it.n].qty + it.q);
                  prod[it.n].locations.push({ col, can: c, floor: f, idx });
                  tot = roundQty(tot + it.q);
                });
              }
            }
          }
        }
      });
      return { prod, tot };
    }

    function sortEntries(entries, sortMode, dir, valueOf) {
      const sorted = entries.slice();
      const mult = dir === 'asc' ? 1 : -1;
      if (sortMode === 'name') sorted.sort((a, b) => mult * a[0].localeCompare(b[0], 'ko'));
      else sorted.sort((a, b) => mult * (valueOf(a[1]) - valueOf(b[1])));
      return sorted;
    }

    function updateSortDirLabel(btnId, dir) {
      document.getElementById(btnId).textContent = dir === 'desc' ? '↓ 내림' : '↑ 오름';
    }

    function getStockStatus(qty) {
      if (qty <= 10) return { color: '#E24B4A' };
      if (qty <= 50) return { color: '#639922' };
      return { color: '#378ADD' };
    }

    function renderStats() {
      const { prod, tot } = getProductTotals();
      const sortMode = document.getElementById('stats-sort').value;
      updateSortDirLabel('stats-sort-dir', statsSortDir);
      const entries = sortEntries(Object.entries(prod), sortMode, statsSortDir, data => data.qty);

      let html = `<div class="stats-summary-bar">
        <div class="stats-summary-count">전체 ${fmtQtyComma(tot)}개 · 종류 ${Object.keys(prod).length.toLocaleString()}</div>
        <div class="stats-legend">
          <span><span class="legend-dot" style="background:#E24B4A;"></span>부족 10개↓</span>
          <span><span class="legend-dot" style="background:#639922;"></span>적정 11~50</span>
          <span><span class="legend-dot" style="background:#378ADD;"></span>여유 51개↑</span>
        </div>
      </div>`;

      entries.forEach(([n, data]) => {
        const { color } = getStockStatus(data.qty);
        const chipsHtml = data.locations.map(loc => `<button class="loc-chip" onclick="openEditModal('${loc.col}',${loc.can},${loc.floor},${loc.idx})">
          <span class="loc-col">${loc.col}</span><span class="loc-dash">·</span><span class="loc-can">${loc.can}</span><span class="loc-dash">·</span><span class="loc-floor">${loc.floor}</span>
        </button>`).join('');
        html += `<div class="stock-card">
          <div class="stock-card-bar" style="background:${color};"></div>
          <div class="stock-card-body">
            <div class="stock-card-header">
              <span class="stock-card-name">${n}</span>
              <span class="stock-card-qty" style="color:${color};">${fmtQty(data.qty)}개</span>
            </div>
            <div class="loc-chips">${chipsHtml}</div>
          </div>
        </div>`;
      });
      document.getElementById('stats-content').innerHTML = html;
    }

    function getAvailableMonths() {
      const months = new Set();
      logs.forEach(l => { if (l.date) months.add(l.date.slice(0, 7)); });
      return Array.from(months).sort();
    }

    function getSelectedMonth() {
      const sel = document.getElementById('month-select');
      if (sel && sel.value) return sel.value;
      const months = getAvailableMonths();
      return months.length ? months[months.length - 1] : getTodayDate().slice(0, 7);
    }

    function getMonthlyProductStats(month) {
      const prod = {};
      logs.forEach(l => {
        if (!l.date || l.date.slice(0, 7) !== month) return;
        if (!prod[l.name]) prod[l.name] = { in: 0, out: 0 };
        if (l.type === '입고') prod[l.name].in = roundQty(prod[l.name].in + l.qty);
        else if (l.type === '출고') prod[l.name].out = roundQty(prod[l.name].out + l.qty);
      });
      return prod;
    }

    function renderMonthlyStats() {
      const months = getAvailableMonths();
      const sel = document.getElementById('month-select');
      const keep = sel.value;
      sel.innerHTML = months.length
        ? months.map(m => `<option value="${m}">${m}</option>`).join('')
        : '<option value="">데이터 없음</option>';
      sel.value = months.includes(keep) ? keep : (months[months.length - 1] || '');

      const month = sel.value;
      const sortMode = document.getElementById('monthly-sort').value;
      updateSortDirLabel('monthly-sort-dir', monthlySortDir);
      const prod = getMonthlyProductStats(month);
      const entries = sortEntries(Object.entries(prod), sortMode, monthlySortDir, v => v.in + v.out);

      let html = '';
      if (!month || entries.length === 0) {
        html = '<div style="color:#999; text-align:center; padding:20px;">해당 월의 입출고 기록이 없습니다</div>';
      } else {
        entries.forEach(([name, v]) => {
          html += `<div style="padding:15px;display:flex;justify-content:space-between;border-bottom:1px solid #ddd;font-size:16px;">
            <span>${name}</span>
            <span><span style="color:#28a745;font-weight:bold;">입고 ${fmtQty(v.in)}</span> / <span style="color:#e8590c;font-weight:bold;">출고 ${fmtQty(v.out)}</span></span>
          </div>`;
        });
      }
      document.getElementById('monthly-stats-content').innerHTML = html;
    }

    function setLogTypeFilter(type, btn) {
      logTypeFilter = type;
      document.querySelectorAll('.log-type-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderLogs();
    }

    function toggleLogSortDir() {
      logSortDir = logSortDir === 'desc' ? 'asc' : 'desc';
      renderLogs();
    }

    function updateLogSortDirLabel() {
      document.getElementById('log-sort-dir').textContent = logSortDir === 'desc' ? '↓ 최신순' : '↑ 오래된순';
    }

    function getFilteredSortedLogs() {
      const from = document.getElementById('log-date-from').value;
      const to = document.getElementById('log-date-to').value;
      const filtered = logs.filter(l => {
        if (logTypeFilter !== 'all' && l.type !== logTypeFilter) return false;
        if (from && (!l.date || l.date < from)) return false;
        if (to && (!l.date || l.date > to)) return false;
        return true;
      });
      const mult = logSortDir === 'asc' ? 1 : -1;
      filtered.sort((a, b) => mult * ((a.date || '').localeCompare(b.date || '')) || mult * (a.id - b.id));
      return filtered;
    }

    function renderLogs() {
      updateLogSortDirLabel();
      const filtered = getFilteredSortedLogs();
      let html = '';
      if (logs.length === 0) {
        html = '<div style="color: #999; text-align: center; padding: 20px;">로그가 없습니다</div>';
      } else {
        html += `<button onclick="clearLogs()" style="background:#dc3545; margin-bottom:15px;">전체 삭제</button>`;
        if (filtered.length === 0) {
          html += '<div style="color: #999; text-align: center; padding: 20px;">조건에 맞는 로그가 없습니다</div>';
        } else {
          filtered.forEach(log => {
            let icon, color, lineHtml;
            if (log.type === '이동') {
              icon = '🔀';
              color = '#6f42c1';
              lineHtml = `${icon} 이동: <span class="log-loc-col">${log.fromCol}</span>열 <span class="log-loc-can">${log.fromCan}</span>칸 <span class="log-loc-floor">${log.fromFloor}</span>층 → <span class="log-loc-col">${log.col}</span>열 <span class="log-loc-can">${log.can}</span>칸 <span class="log-loc-floor">${log.floor}</span>층 - <span class="log-item-name">${log.name}</span>`;
            } else if (log.type === '출고취소') {
              icon = '↩️';
              color = '#0ea5e9';
              lineHtml = `${icon} 출고취소: <span class="log-loc-col">${log.col}</span>열 <span class="log-loc-can">${log.can}</span>칸 <span class="log-loc-floor">${log.floor}</span>층 - <span class="log-item-name">${log.name}</span>`;
            } else {
              icon = log.type === '입고' ? '📥' : '📤';
              color = log.type === '입고' ? '#28a745' : '#ffc107';
              lineHtml = `${icon} ${log.type}: <span class="log-loc-col">${log.col}</span>열 <span class="log-loc-can">${log.can}</span>칸 <span class="log-loc-floor">${log.floor}</span>층 - <span class="log-item-name">${log.name}</span>`;
            }
            html += `<div class="log-entry" style="border-left-color: ${color};">
              <div class="log-first-line">
                <span>${lineHtml}</span>
                <button class="log-del" onclick="deleteLog(${log.id})">삭제</button>
              </div>
              <div>수량: <span class="log-qty">${fmtQty(log.qty)}개</span></div>
              <div class="log-date">${log.date}</div>
            </div>`;
          });
        }
      }
      document.getElementById('logs-content').innerHTML = html;
    }

    async function deleteLog(id) {
      if (!confirm('이 로그를 삭제할까요?')) return;
      const { error } = await sb.from('inventory_logs').delete().eq('id', id);
      if (error) return alert('삭제 오류: ' + error.message);
      await loadLogs();
      renderLogs();
    }

    async function clearLogs() {
      if (!confirm('로그 전체를 삭제할까요?')) return;
      const { error } = await sb.from('inventory_logs').delete().gte('id', 0);
      if (error) return alert('삭제 오류: ' + error.message);
      await loadLogs();
      renderLogs();
    }

    // 출고표 위치 표시: "B열 1칸 1층" 형식 (층 색상은 기존 1/2/3층 색을 그대로 사용)
    function shipLocHtml(r) {
      const fc = getFloorColor(r.floor);
      return `<span class="log-loc-col">${r.col}</span>열 <span class="log-loc-can">${r.can}</span>칸 <span style="color:${fc};">${r.floor}</span>층`;
    }
    function shipLocText(r) {
      return `${r.col}열 ${r.can}칸 ${r.floor}층`;
    }

    // ===== 출고표 탭: 상품 검색 후 바로 출고표에 추가 =====
    let shipSearchOpenId = null; // 수량 입력칸이 열려 있는 재고 id
    let shipSearchBusy = false;

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    // 재고 id로 현재 위치/상품을 찾는다 (실시간 갱신으로 순서가 바뀌어도 안전)
    function findInvItemById(id) {
      for (const col of Object.keys(inv)) {
        for (const can of Object.keys(inv[col])) {
          for (const floor of Object.keys(inv[col][can])) {
            const item = inv[col][can][floor].find(it => it.id === id);
            if (item) return { col, can: parseInt(can), floor: parseInt(floor), id, item };
          }
        }
      }
      return null;
    }

    // 전체 재고를 위치별 한 줄씩 펼친다: [{ col, can, floor, id, name, qty }]
    function listInvRows() {
      const rows = [];
      Object.keys(inv).forEach(col => Object.keys(inv[col]).forEach(can => Object.keys(inv[col][can]).forEach(floor => {
        inv[col][can][floor].forEach(it => rows.push({ col, can: parseInt(can), floor: parseInt(floor), id: it.id, name: it.n, qty: it.q }));
      })));
      return rows;
    }

    function onShipSearchInput() {
      shipSearchOpenId = null;
      renderShipSearch();
    }

    function renderShipSearch() {
      const box = document.getElementById('ship-search-results');
      const q = document.getElementById('ship-search-input').value.trim().toLowerCase();
      if (!q) { box.innerHTML = ''; return; }

      // 실시간 갱신으로 다시 그려도 입력 중이던 수량은 유지
      const prevQtyInput = document.getElementById('ship-search-qty');
      const prevQty = prevQtyInput ? prevQtyInput.value : '';

      const rows = listInvRows().filter(r => r.name.toLowerCase().includes(q));

      if (rows.length === 0) { box.innerHTML = '<div class="ship-sr-empty">재고에 없는 상품이에요</div>'; return; }
      if (shipSearchOpenId !== null && !rows.some(r => r.id === shipSearchOpenId)) shipSearchOpenId = null;

      // 위치순 정렬 (열 → 칸 숫자순 → 층)
      box.innerHTML = sortShippingRows(rows).map(r => {
        const open = r.id === shipSearchOpenId;
        return `<div class="ship-sr${open ? ' open' : ''}" style="border-left-color:${getFloorColor(r.floor)};">
          <div class="ship-sr-line" onclick="toggleShipSearchRow(${r.id})">
            <span class="ship-loc">${shipLocHtml(r)}</span>
            <span class="ship-name">${escapeHtml(r.name)}</span>
            <span class="ship-sr-stock">재고 ${fmtQty(r.qty)}개</span>
          </div>
          ${open ? `<div class="ship-sr-form">
            <input type="number" id="ship-search-qty" inputmode="decimal" placeholder="출고 수량" min="0.01" step="0.01" value="${escapeHtml(prevQty)}" onkeydown="if(event.key==='Enter')addShipFromSearch(${r.id})">
            <button onclick="addShipFromSearch(${r.id})">출고표에 추가</button>
          </div>` : ''}
        </div>`;
      }).join('');
    }

    // 한 줄을 누르면 그 줄 아래에 수량 입력칸을 연다 (다른 줄의 입력칸은 닫힘)
    function toggleShipSearchRow(id) {
      const opening = shipSearchOpenId !== id;
      shipSearchOpenId = opening ? id : null;
      const prev = document.getElementById('ship-search-qty');
      if (prev) prev.value = '';
      renderShipSearch();
      if (opening) document.getElementById('ship-search-qty').focus();
    }

    async function addShipFromSearch(id) {
      if (shipSearchBusy) return;
      const found = findInvItemById(id);
      if (!found) {
        shipSearchOpenId = null;
        renderShipSearch();
        return alert('재고에서 상품을 찾을 수 없습니다 (이미 삭제되었을 수 있어요)');
      }
      const { item } = found;
      const qty = readQtyInput('ship-search-qty');
      if (qty === null) return alert('출고표 수량을 0보다 큰 숫자로 입력해주세요 (소수점 두 자리까지)');
      if (qty > item.q) return alert(`재고가 부족합니다 (현재 재고 ${fmtQty(item.q)}개)`);

      shipSearchBusy = true;
      try {
        const result = await addToShippingSheet(item, qty, found);
        if (result.shipErr) return;
        // 추가 후에는 입력칸을 닫고, 검색어는 그대로 두고 줄어든 재고로 다시 그린다
        const qtyInput = document.getElementById('ship-search-qty');
        if (qtyInput) qtyInput.value = '';
        shipSearchOpenId = null;
        renderShipSearch();
        alertShipResult(result);
      } finally {
        shipSearchBusy = false;
      }
    }

    // ===== 사장님 출고 사진 → 출고표 자동 입력 =====
    // 사진은 Supabase Edge Function(read-shipping-photo)으로 보내고,
    // 그 안에서 제미나이가 표를 읽는다. (제미나이 키는 Supabase Secrets 에만 있음)
    const PHOTO_FUNCTION_NAME = 'read-shipping-photo';
    const PHOTO_MAX_SIDE = 1600; // 긴 변 기준 px. 글씨는 읽히면서 전송은 빠른 크기
    let photoReview = null;      // 확인 화면 상태 { rows, aliasError } (null 이면 닫힘)
    let photoBusy = false;

    function setPhotoStatus(text, isErr) {
      const el = document.getElementById('ship-photo-status');
      el.textContent = text;
      el.classList.toggle('err', !!isErr);
    }

    // 이미지를 긴 변 PHOTO_MAX_SIDE 이하 JPEG 로 줄여서 base64(접두어 없이)로 돌려준다
    function shrinkImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          const scale = Math.min(1, PHOTO_MAX_SIDE / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff'; // 투명 PNG(캡처 이미지) 배경을 흰색으로
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.85).split(',')[1]);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이미지를 열 수 없어요 (jpg/png 사진으로 올려 주세요)')); };
        img.src = url;
      });
    }

    function onShipPhotoFile(e) {
      const file = e.target.files && e.target.files[0];
      e.target.value = ''; // 같은 사진을 다시 골라도 동작하도록
      if (file) handleShipPhoto(file);
    }

    async function describeFunctionError(error) {
      const res = error && error.context;
      if (res && res.status === 404) return `Edge Function(${PHOTO_FUNCTION_NAME})이 아직 배포되지 않았어요`;
      try {
        if (res && typeof res.json === 'function') {
          const body = await res.json();
          if (body && body.error) return body.error;
        }
      } catch (e) { /* 본문이 JSON 이 아니면 아래 기본 문구 사용 */ }
      return (error && error.message) || '사진 읽기 요청에 실패했어요';
    }

    async function handleShipPhoto(file) {
      if (photoBusy) return;
      if (!file.type || !file.type.startsWith('image/')) return alert('이미지 파일만 올릴 수 있어요');
      if (photoReview && !confirm('확인 중인 사진 결과가 있어요. 새 사진으로 바꿀까요?')) return;

      photoBusy = true;
      photoReview = null;
      renderPhotoReview();
      setPhotoStatus('⏳ 사진 읽는 중... (10~30초 정도 걸려요)');
      try {
        const image = await shrinkImage(file);
        const { data, error } = await sb.functions.invoke(PHOTO_FUNCTION_NAME, { body: { image, mimeType: 'image/jpeg' } });
        console.log('[사진 출고표] Edge Function 응답:', data, error);
        if (error) throw new Error(await describeFunctionError(error));
        if (data && data.error) throw new Error(data.error);
        const items = (data && data.items) || [];
        if (items.length === 0) throw new Error('사진에서 출고 항목을 찾지 못했어요. 표가 잘 보이게 다시 찍어 주세요.');

        const { aliases, error: aliasError } = await loadNameAliases();
        photoReview = { rows: items.map(it => buildPhotoRow(it, aliases)), aliasError };
        setPhotoStatus('');
        renderPhotoReview();
      } catch (err) {
        console.error('[사진 출고표] 실패:', err);
        setPhotoStatus('❌ ' + err.message, true);
      } finally {
        photoBusy = false;
      }
    }

    // 이름 짝 기억 테이블: { 사장님제품명: 재고상품명 }
    async function loadNameAliases() {
      const { data, error } = await sb.from('name_alias').select('sheet_name, item_name');
      logSb('select', 'name_alias', error, data);
      const aliases = {};
      (data || []).forEach(r => { aliases[r.sheet_name] = r.item_name; });
      return { aliases, error };
    }

    // 비교용: 공백 제거 + 소문자
    function normName(s) {
      return String(s || '').replace(/\s+/g, '').toLowerCase();
    }

    // "6/3" 과 "6/30" 이 둘 다 포함되면 더 긴(구체적인) 이름만 남긴다
    function longestNameOnly(rows) {
      if (rows.length === 0) return rows;
      const maxLen = Math.max(...rows.map(r => normName(r.name).length));
      return rows.filter(r => normName(r.name).length === maxLen);
    }

    // 사진 한 줄 → 재고 매칭
    // 1) 기억된 이름 짝  2) 사진 위치 안에서 "재고 상품명이 사장님 제품명에 포함"  3) 전체 재고에서 같은 방식
    function buildPhotoRow(it, aliases) {
      const all = listInvRows();
      const hasLoc = !!(it.col || it.can || it.floor);
      const atLoc = r => (!it.col || r.col === it.col) && (!it.can || r.can === it.can) && (!it.floor || r.floor === it.floor);
      let candidates = [];

      const aliasName = aliases[it.name];
      if (aliasName) {
        const same = all.filter(r => r.name === aliasName);
        candidates = hasLoc && same.some(atLoc) ? same.filter(atLoc) : same;
      }
      if (candidates.length === 0) {
        const sheet = normName(it.name);
        const contains = all.filter(r => normName(r.name) !== '' && sheet.includes(normName(r.name)));
        const inLoc = hasLoc ? contains.filter(atLoc) : [];
        candidates = longestNameOnly(inLoc.length > 0 ? inLoc : contains);
      }
      candidates = sortShippingRows(candidates);

      const auto = candidates.length === 1;
      return {
        sheetName: it.name,
        sheetLoc: hasLoc ? it : null,
        qtyText: String(roundQty(it.qty)),
        candidateIds: candidates.map(r => r.id),
        matchId: auto ? candidates[0].id : null,
        auto,          // 자동 매칭된 줄 (초록)
        remember: true // 직접 고른 줄: 다음부터 자동으로 맞추기
      };
    }

    // 확인 화면 검사: 빨간 줄 / 잘못된 수량 / 재고 부족
    function photoReviewCheck() {
      const byId = new Map(listInvRows().map(r => [r.id, r]));
      const info = photoReview.rows.map(row => ({
        item: row.matchId == null ? null : (byId.get(row.matchId) || null),
        qty: parseQtyValue(row.qtyText)
      }));
      // 같은 재고 상품이 여러 줄에 매칭될 수 있으니 상품별 합계로 비교
      const totals = new Map();
      info.forEach(x => { if (x.item && x.qty !== null) totals.set(x.item.id, roundQty((totals.get(x.item.id) || 0) + x.qty)); });
      info.forEach(x => {
        x.total = x.item ? (totals.get(x.item.id) || 0) : 0;
        x.over = !!x.item && x.qty !== null && x.total > x.item.qty;
      });
      return {
        info,
        redCount: info.filter(x => !x.item).length,
        badQtyCount: info.filter(x => x.qty === null).length,
        overCount: info.filter(x => x.over).length
      };
    }

    function renderPhotoReview() {
      const box = document.getElementById('ship-photo-review');
      if (!photoReview) { box.innerHTML = ''; return; }

      const all = sortShippingRows(listInvRows());
      const byId = new Map(all.map(r => [r.id, r]));
      const optText = r => escapeHtml(`${shipLocText(r)} · ${r.name} · 재고 ${fmtQty(r.qty)}개`);

      let html = `<div class="pr-card"><div class="pr-title">📷 사진에서 읽은 출고 목록 (${photoReview.rows.length}건)</div>`;
      if (photoReview.aliasError) {
        html += `<div class="pr-need" style="margin:0 0 10px;">이름 짝 기억 테이블(name_alias)을 읽지 못했어요. supabase_update_name_alias.sql 을 실행해 주세요.</div>`;
      }
      photoReview.rows.forEach((row, i) => {
        const item = row.matchId == null ? null : (byId.get(row.matchId) || null);
        const sheetLoc = row.sheetLoc ? ` <span class="ship-date">(사진 위치: ${[row.sheetLoc.col && row.sheetLoc.col + '열', row.sheetLoc.can && row.sheetLoc.can + '칸', row.sheetLoc.floor && row.sheetLoc.floor + '층'].filter(Boolean).join(' ')})</span>` : '';
        html += `<div class="pr-row${item ? '' : ' red'}">
          <div class="pr-top">
            <span class="pr-sheet-name">${escapeHtml(row.sheetName)}${sheetLoc}</span>
            <input type="number" class="pr-qty" inputmode="decimal" min="0.01" step="0.01" value="${escapeHtml(row.qtyText)}" oninput="onPhotoQtyInput(${i}, this.value)">
            <span class="pr-unit">박스</span>
          </div>`;
        if (item) {
          html += `<div class="pr-match">→ ${shipLocHtml(item)} · <b>${escapeHtml(item.name)}</b> · <span class="ship-sr-stock">재고 ${fmtQty(item.qty)}개</span></div>`;
        }
        if (row.auto) {
          html += `<button type="button" class="pr-change" onclick="unlockPhotoRow(${i})">다른 상품으로 바꾸기</button>`;
        } else {
          if (!item) {
            const n = row.candidateIds.length;
            html += `<div class="pr-need">${n > 1 ? `재고 ${n}곳에 있어요. 하나를 골라주세요` : '재고에서 못 찾았어요. 직접 골라주세요'}</div>`;
          }
          let selectedDone = false;
          const opt = r => {
            const sel = !selectedDone && r.id === row.matchId;
            if (sel) selectedDone = true;
            return `<option value="${r.id}"${sel ? ' selected' : ''}>${optText(r)}</option>`;
          };
          const cands = row.candidateIds.map(id => byId.get(id)).filter(Boolean);
          html += `<select class="pr-select" onchange="onPhotoPick(${i}, this.value)">
            <option value="">-- 재고에서 고르기 --</option>
            ${cands.length > 0 ? `<optgroup label="후보">${cands.map(opt).join('')}</optgroup>` : ''}
            <optgroup label="전체 재고">${all.map(opt).join('')}</optgroup>
          </select>
          <label class="pr-remember"><input type="checkbox"${row.remember ? ' checked' : ''} onchange="photoReview.rows[${i}].remember = this.checked"> 다음부터 이 이름은 자동으로 맞추기</label>`;
        }
        html += `<div class="pr-warn" id="pr-warn-${i}"></div></div>`;
      });
      html += `<div class="pr-footer">
          <div class="pr-block-msg" id="pr-block-msg"></div>
          <button type="button" class="pr-add" id="pr-add-btn" onclick="confirmPhotoReview()">✅ 전체 출고표에 추가</button>
          <button type="button" class="pr-cancel" onclick="cancelPhotoReview()">취소</button>
        </div></div>`;
      box.innerHTML = html;
      updatePhotoReviewStatus();
    }

    // 전체를 다시 그리지 않고 경고 문구/버튼 상태만 갱신 (수량 입력 중 포커스 유지)
    function updatePhotoReviewStatus() {
      if (!photoReview) return;
      const { info, redCount, badQtyCount, overCount } = photoReviewCheck();
      info.forEach((x, i) => {
        const el = document.getElementById('pr-warn-' + i);
        if (!el) return;
        if (x.qty === null) el.textContent = '⚠ 박스 수를 0보다 큰 숫자로 입력해 주세요';
        else if (x.over) el.textContent = x.total > x.qty
          ? `⚠ 재고 부족: 같은 상품 합계 ${fmtQty(x.total)}개 > 재고 ${fmtQty(x.item.qty)}개`
          : `⚠ 재고 부족: 재고 ${fmtQty(x.item.qty)}개보다 많아요`;
        else el.textContent = '';
      });
      let msg = '';
      if (redCount > 0) msg = `빨간 항목 ${redCount}건 먼저 골라주세요`;
      else if (badQtyCount > 0) msg = `박스 수가 비었거나 0 이하인 항목 ${badQtyCount}건을 고쳐주세요`;
      else if (overCount > 0) msg = `재고보다 많은 항목 ${overCount}건의 박스 수를 고쳐주세요`;
      document.getElementById('pr-block-msg').textContent = msg;
      const btn = document.getElementById('pr-add-btn');
      btn.disabled = !!msg || photoBusy;
      btn.textContent = photoBusy ? '⏳ 추가 중...' : `✅ 전체 출고표에 추가 (${photoReview.rows.length}건)`;
    }

    function onPhotoQtyInput(i, value) {
      photoReview.rows[i].qtyText = value;
      updatePhotoReviewStatus();
    }

    function onPhotoPick(i, value) {
      photoReview.rows[i].matchId = value === '' ? null : Number(value);
      renderPhotoReview();
    }

    function unlockPhotoRow(i) {
      photoReview.rows[i].auto = false;
      renderPhotoReview();
    }

    function cancelPhotoReview() {
      if (photoBusy) return;
      photoReview = null;
      renderPhotoReview();
      setPhotoStatus('');
    }

    async function confirmPhotoReview() {
      if (!photoReview || photoBusy) return;
      const { info, redCount, badQtyCount, overCount } = photoReviewCheck();
      if (redCount || badQtyCount || overCount) return updatePhotoReviewStatus();
      const rows = photoReview.rows;
      const totalQty = info.reduce((s, x) => roundQty(s + x.qty), 0);
      if (!confirm(`${rows.length}건 (합계 ${fmtQtyComma(totalQty)}박스)을 출고표에 추가할까요?`)) return;

      photoBusy = true;
      updatePhotoReviewStatus();
      try {
        // 1) 직접 고른 이름 짝 저장 (재고 소진으로 상품이 삭제되기 전에 이름을 기록)
        const aliasMap = new Map();
        rows.forEach((row, k) => {
          if (!row.auto && row.remember && info[k].item) aliasMap.set(row.sheetName, info[k].item.name);
        });
        let aliasErr = null;
        if (aliasMap.size > 0) {
          const aliasRows = Array.from(aliasMap, ([sheet_name, item_name]) => ({ sheet_name, item_name }));
          const { error } = await sb.from('name_alias').upsert(aliasRows, { onConflict: 'sheet_name' });
          logSb('upsert', 'name_alias', error, aliasRows);
          aliasErr = error;
        }

        // 2) 줄마다 기존 "출고표입력"과 같은 함수로 처리
        //    (출고표 기록 → 재고 차감, 0이면 삭제 → '출고' 로그)
        let okCount = 0;
        const fails = [];
        for (let k = 0; k < rows.length; k++) {
          const name = rows[k].sheetName;
          const found = findInvItemById(info[k].item.id); // 앞 줄 처리로 재고가 바뀌었을 수 있어 매번 새로 찾는다
          if (!found) { fails.push(`${name}: 재고에서 상품이 사라졌어요`); continue; }
          if (info[k].qty > found.item.q) { fails.push(`${name}: 재고 부족 (현재 ${fmtQty(found.item.q)}개)`); continue; }
          const result = await addToShippingSheet(found.item, info[k].qty, found);
          if (result.shipErr) { fails.push(`${name}: 출고표 기록 실패`); continue; }
          if (result.error) { fails.push(`${name}: 출고표엔 기록됐지만 재고 차감 실패 (${result.error.message})`); continue; }
          if (result.logErr) fails.push(`${name}: 로그 저장 실패 (출고표·재고는 반영됨)`);
          okCount++;
        }

        photoReview = null;
        renderPhotoReview();
        let msg = `출고표에 ${okCount}건 추가되었습니다!`;
        if (fails.length > 0) msg += `\n\n확인이 필요한 항목:\n- ${fails.join('\n- ')}`;
        if (aliasErr) msg += `\n\n(이름 짝 저장 실패: ${aliasErr.message})`;
        alert(msg);
      } finally {
        photoBusy = false;
        updatePhotoReviewStatus();
      }
    }

    // PC: 출고표 탭을 보고 있을 때 Ctrl+V 로 클립보드 이미지 올리기
    document.addEventListener('paste', (e) => {
      if (!document.getElementById('ship').classList.contains('active')) return;
      if (document.getElementById('editModal').classList.contains('active')) return;
      const imageItem = Array.from((e.clipboardData && e.clipboardData.items) || [])
        .find(it => it.kind === 'file' && it.type.startsWith('image/'));
      if (!imageItem) return; // 글자 붙여넣기는 평소대로
      e.preventDefault();
      handleShipPhoto(imageItem.getAsFile());
    });

    // 올리기 영역에 이미지 끌어다 놓기
    (function setupShipPhotoDrop() {
      const zone = document.getElementById('ship-photo-drop');
      ['dragenter', 'dragover'].forEach(ev => zone.addEventListener(ev, (e) => { e.preventDefault(); zone.classList.add('dragover'); }));
      ['dragleave', 'drop'].forEach(ev => zone.addEventListener(ev, (e) => { e.preventDefault(); zone.classList.remove('dragover'); }));
      zone.addEventListener('drop', (e) => {
        const file = Array.from((e.dataTransfer && e.dataTransfer.files) || []).find(f => f.type.startsWith('image/'));
        if (file) handleShipPhoto(file); else alert('이미지 파일을 끌어다 놓아 주세요');
      });
      // 영역 밖에 잘못 놓아도 브라우저가 사진을 열어버리지 않도록
      window.addEventListener('dragover', (e) => e.preventDefault());
      window.addEventListener('drop', (e) => e.preventDefault());
    })();

    function renderShippingSheet() {
      if (shippingSheetError) {
        document.getElementById('ship-content').innerHTML =
          `<div style="color:#b02a37; background:#fff5f5; border:1px solid #f1c0c4; border-radius:8px; padding:16px; line-height:1.6;">
            출고표 테이블(shipping_sheet)을 읽을 수 없습니다.<br>
            <b>supabase_update_2026-10-01.sql</b> 파일을 Supabase SQL Editor에서 한 번 실행해 주세요.<br>
            <span style="color:#888; font-size:13px;">(오류: ${shippingSheetError})</span>
          </div>`;
        return;
      }
      const rows = sortShippingRows(shippingSheet);
      let html = '';
      if (rows.length === 0) {
        html = '<div style="color:#999; text-align:center; padding:20px;">출고표가 비어 있습니다</div>';
      } else {
        const total = rows.reduce((sum, r) => roundQty(sum + Number(r.qty)), 0);
        html += `<div class="stats-summary-bar"><div class="stats-summary-count">${rows.length}건 · 합계 ${fmtQtyComma(total)}개</div></div>`;
        rows.forEach(r => {
          const fc = getFloorColor(r.floor);
          html += `<div class="ship-row" style="border-left-color:${fc};">
            <span class="ship-loc">${shipLocHtml(r)}</span>
            <span class="ship-name">${r.name}</span>
            <span class="ship-qty">${fmtQty(r.qty)}개</span>
            <span class="ship-date">${r.date || ''}</span>
            <button class="ship-del" onclick="cancelShipRow(${r.id})">취소</button>
          </div>`;
        });
      }
      document.getElementById('ship-content').innerHTML = html;
    }

    // 출고표 한 건을 재고로 되돌린다.
    // - 같은 위치(열/칸/층)에 같은 상품명이 있으면 그 상품 수량에 더한다.
    // - 출고로 재고가 0이 돼서 상품이 삭제됐던 경우엔 그 위치에 새로 만든다 (입고일: 오늘).
    // - 되돌릴 때마다 inventory_logs에 '출고취소' 로그를 남긴다.
    async function restoreStockFromShipRow(row) {
      await loadInventory(); // 항상 최신 재고 상태를 기준으로 합칠지/새로 만들지 판단한다
      const { col, can, floor, name } = row;
      const qty = roundQty(row.qty);
      const destItems = (inv[col] && inv[col][can] && inv[col][can][floor]) || [];
      const existing = destItems.find(it => it.n === name);

      if (existing) {
        const newQty = roundQty(existing.q + qty);
        const { error } = await sb.from('inventory_items').update({ qty: newQty }).eq('id', existing.id);
        logSb('update', 'inventory_items', error, { id: existing.id, qty: newQty });
        if (error) return { error };
      } else {
        const insertPayload = { col, can, floor, name, qty, in_date: getTodayDate(), exp_date: null };
        const { error } = await sb.from('inventory_items').insert(insertPayload);
        logSb('insert', 'inventory_items', error, insertPayload);
        if (error) return { error };
      }

      const logPayload = { type: '출고취소', col, can, floor, name, qty, date: getTodayDate() };
      const { error: logErr } = await sb.from('inventory_logs').insert(logPayload);
      logSb('insert', 'inventory_logs', logErr, logPayload);
      if (logErr) console.error('[Supabase] 출고취소 로그 저장 실패:', logErr);

      return { error: null };
    }

    // 출고표 행 하나를 취소(= 재고 원복) 하고 그 행을 출고표에서 지운다.
    async function cancelShipRow(id) {
      const row = shippingSheet.find(r => r.id === id);
      if (!row) return;
      const loc = shipLocText(row);
      if (!confirm(`재고 ${fmtQty(row.qty)}개가 원래 위치(${loc})로 복구됩니다. 취소할까요?`)) return;

      const { error } = await restoreStockFromShipRow(row);
      if (error) { console.error('[Supabase] 출고 취소(재고 복구) 실패:', error); return alert('재고 복구 오류: ' + error.message); }

      const { error: delErr } = await sb.from('shipping_sheet').delete().eq('id', id);
      logSb('delete', 'shipping_sheet', delErr, { id });

      await loadInventory();
      await loadLogs();
      await loadShippingSheet();
      render();
      renderLogs();
      renderShippingSheet();

      if (delErr) { console.error('[Supabase] 출고표 행 삭제 실패:', delErr); return alert('재고는 복구됐지만 출고표 행 삭제에 실패했습니다: ' + delErr.message); }
      alert('출고가 취소되어 재고가 복구되었습니다!');
    }

    // "출고 완료": 재고는 그대로 두고 출고표 기록만 전부 삭제 (실제로 물건이 나간 뒤 정리용)
    async function completeShipping() {
      if (shippingSheet.length === 0) return alert('출고표가 비어 있습니다');
      if (!confirm(`출고표 ${shippingSheet.length}건을 출고 완료 처리할까요?\n(재고는 그대로 두고 출고표 기록만 삭제됩니다)`)) return;
      const { error } = await sb.from('shipping_sheet').delete().gte('id', 0);
      logSb('delete', 'shipping_sheet', error, '전체(출고완료)');
      if (error) return alert('삭제 오류: ' + error.message);
      await loadShippingSheet();
      renderShippingSheet();
      alert('출고 완료 처리되었습니다!');
    }

    // "전체 취소": 출고표 모든 행을 재고로 되돌린 뒤(행마다 '출고취소' 로그 기록) 출고표를 비운다
    async function cancelAllShipping() {
      if (shippingSheet.length === 0) return alert('출고표가 비어 있습니다');
      const rows = sortShippingRows(shippingSheet);
      const total = rows.reduce((sum, r) => roundQty(sum + Number(r.qty)), 0);
      if (!confirm(`출고표 ${rows.length}건(합계 ${fmtQtyComma(total)}개)을 전체 취소할까요?\n각 상품이 원래 위치로 복구되고, 출고표 기록은 모두 삭제됩니다.`)) return;

      let failCount = 0;
      for (const row of rows) {
        const { error } = await restoreStockFromShipRow(row);
        if (error) { failCount++; console.error('[Supabase] 전체 취소 중 재고 복구 실패:', row, error); continue; }
        const { error: delErr } = await sb.from('shipping_sheet').delete().eq('id', row.id);
        if (delErr) { failCount++; console.error('[Supabase] 전체 취소 중 출고표 행 삭제 실패:', row, delErr); }
      }

      await loadInventory();
      await loadLogs();
      await loadShippingSheet();
      render();
      renderLogs();
      renderShippingSheet();

      if (failCount > 0) alert(`일부 항목(${failCount}건) 처리에 실패했습니다. 콘솔(F12)에서 확인해주세요.`);
      else alert('전체 취소되었습니다! 재고가 모두 복구되었습니다.');
    }

    function downloadShippingExcel() {
      // 화면에 보이는 정렬 순서(열 → 칸 → 층) 그대로 내보낸다
      const rows = [['위치', '상품명', '수량', '날짜']];
      sortShippingRows(shippingSheet).forEach(r => {
        rows.push([shipLocText(r), r.name, roundQty(r.qty), r.date || '']);
      });
      const ws = XLSX.utils.aoa_to_sheet(rows);
      applyQtyFormat(ws, 'C', rows.length);
      ws['!cols'] = [{ wch: 16 }, { wch: 24 }, { wch: 10 }, { wch: 14 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '출고표');
      XLSX.writeFile(wb, `출고표_${getTodayDate()}.xlsx`);
    }

    function doSearch() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const { prod } = getProductTotals();
      let html = '';
      ['A','B','C'].forEach(col => {
        for (let c = 1; c <= 20; c++) {
          if (inv[col][c]) {
            for (let f = 1; f <= 10; f++) {
              if (inv[col][c][f]) {
                inv[col][c][f].forEach((it, idx) => {
                  if (it.n.toLowerCase().includes(q)) {
                    const totalQty = prod[it.n] ? prod[it.n].qty : it.q;
                    const qtyColor = getStockStatus(totalQty).color;
                    html += `<div class="search-result-item" onclick="openEditModal('${col}',${c},${f},${idx})">
                      <span class="log-item-name">${it.n}</span>${it.d ? ` <span class="fl-date">[${it.d}]</span>` : ''}<br>
                      <span class="log-loc-col">${col}</span>열 <span class="log-loc-can">${c}</span>칸 <span class="log-loc-floor">${f}</span>층 | <span style="color:${qtyColor}; font-weight:bold;">${fmtQty(it.q)}개</span>
                    </div>`;
                  }
                });
              }
            }
          }
        }
      });
      document.getElementById('search-results').innerHTML = html || '<div style="color:#999; font-size: 16px;">없음</div>';
    }

    async function resetData() {
      if (!confirm('초기화? (모든 데이터가 지워지고 초기 데이터로 교체됩니다)')) return;

      const { error: delItemsErr } = await sb.from('inventory_items').delete().gte('id', 0);
      if (delItemsErr) return alert('초기화 오류: ' + delItemsErr.message);
      const { error: delLogsErr } = await sb.from('inventory_logs').delete().gte('id', 0);
      if (delLogsErr) return alert('초기화 오류: ' + delLogsErr.message);

      const rows = flattenInitialData();
      if (rows.length) {
        const { error: insErr } = await sb.from('inventory_items').insert(rows);
        if (insErr) return alert('초기화 오류: ' + insErr.message);
      }

      await loadInventory();
      await loadLogs();
      render();
      alert('완료!');
    }

    async function seedInitialData() {
      const { count, error: countErr } = await sb.from('inventory_items').select('*', { count: 'exact', head: true });
      if (countErr) return alert('확인 오류: ' + countErr.message);

      if (count > 0) {
        if (!confirm(`이미 ${count}개의 데이터가 등록되어 있습니다. 그래도 초기 데이터를 추가하시겠습니까? (중복 등록됩니다)`)) return;
      } else {
        if (!confirm('초기 데이터를 Supabase에 등록하시겠습니까?')) return;
      }

      const rows = flattenInitialData();
      const { error } = await sb.from('inventory_items').insert(rows);
      if (error) return alert('등록 오류: ' + error.message);

      alert('초기 데이터가 등록되었습니다!');
      await loadInventory();
      render();
    }

    function downloadCSV() {
      let csv = '열,칸,층,상품명,수량,입고날짜,유통기한\n';
      ['A','B','C'].forEach(col => {
        for (let c = 1; c <= 20; c++) {
          if (inv[col][c]) {
            for (let f = 1; f <= 10; f++) {
              if (inv[col][c][f]) inv[col][c][f].forEach(it => csv += `${col},${c},${f},${it.n},${fmtQty(it.q)},${it.d},${it.e || ''}\n`);
            }
          }
        }
      });
      const blob = new Blob([csv], {type: 'text/csv'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '재고.csv';
      a.click();
    }

    function downloadInventoryExcel() {
      const rows = [['열', '칸', '층', '상품명', '수량', '입고일', '유통기한']];
      ['A', 'B', 'C'].forEach(col => {
        for (let c = 1; c <= 20; c++) {
          if (inv[col][c]) {
            for (let f = 1; f <= 10; f++) {
              if (inv[col][c][f]) inv[col][c][f].forEach(it => rows.push([col, c, f, it.n, roundQty(it.q), it.d || '', it.e || '']));
            }
          }
        }
      });
      const ws = XLSX.utils.aoa_to_sheet(rows);
      applyQtyFormat(ws, 'E', rows.length);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '재고현황');
      XLSX.writeFile(wb, `재고현황_${getTodayDate()}.xlsx`);
    }

    function downloadLogsExcel() {
      const rows = [['구분', '열', '칸', '층', '상품명', '수량', '날짜']];
      logs.forEach(l => rows.push([l.type, l.col, l.can, l.floor, l.name, roundQty(l.qty), l.date]));
      const ws = XLSX.utils.aoa_to_sheet(rows);
      applyQtyFormat(ws, 'F', rows.length);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '입출고로그');
      XLSX.writeFile(wb, `입출고로그_${getTodayDate()}.xlsx`);
    }

    function downloadMonthlyStatsExcel() {
      const month = getSelectedMonth();
      const prod = getMonthlyProductStats(month);
      const rows = [['월', '상품명', '입고', '출고']];
      Object.entries(prod).forEach(([name, v]) => rows.push([month, name, roundQty(v.in), roundQty(v.out)]));
      const ws = XLSX.utils.aoa_to_sheet(rows);
      applyQtyFormat(ws, 'C', rows.length);
      applyQtyFormat(ws, 'D', rows.length);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '월별통계');
      XLSX.writeFile(wb, `월별통계_${month}.xlsx`);
    }

    function downloadJSON() {
      const blob = new Blob([JSON.stringify({inv, logs},null,2)], {type: 'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '재고.json';
      a.click();
    }

    function uploadJSON() { document.getElementById('file-input').click(); }

    function loadJSON(e) {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = async (ev) => {
        try {
          const d = JSON.parse(ev.target.result);
          if (!confirm('현재 Supabase 데이터를 모두 지우고 이 파일로 복원하시겠습니까?')) return;

          const { error: delItemsErr } = await sb.from('inventory_items').delete().gte('id', 0);
          if (delItemsErr) throw new Error(delItemsErr.message);
          const { error: delLogsErr } = await sb.from('inventory_logs').delete().gte('id', 0);
          if (delLogsErr) throw new Error(delLogsErr.message);

          const itemRows = [];
          Object.entries(d.inv || {}).forEach(([col, cans]) => {
            Object.entries(cans).forEach(([can, floors]) => {
              Object.entries(floors).forEach(([floor, items]) => {
                items.forEach(it => itemRows.push({ col, can: parseInt(can), floor: parseInt(floor), name: it.n, qty: roundQty(it.q), in_date: it.d, exp_date: it.e || null }));
              });
            });
          });
          if (itemRows.length) {
            const { error } = await sb.from('inventory_items').insert(itemRows);
            if (error) throw new Error(error.message);
          }

          const logRows = (d.logs || []).map(l => ({ type: l.type, col: l.col, can: l.can, floor: l.floor, name: l.name, qty: roundQty(l.qty), date: l.date }));
          if (logRows.length) {
            const { error } = await sb.from('inventory_logs').insert(logRows);
            if (error) throw new Error(error.message);
          }

          await loadInventory();
          await loadLogs();
          render();
          alert('복원!');
        } catch(err) { alert('오류: ' + err.message); }
      };
      r.readAsText(f);
    }

    (async function init() {
      await loadInventory();
      await loadLogs();
      await loadShippingSheet();
      render();
      renderShippingSheet();
      subscribeRealtime();
    })();
  </script>
