    async function deleteItem() {
      if (!editingItem || !confirm('삭제하시겠어요?')) return;
      const { error } = await sb.from('inventory_items').delete().eq('id', editingItem.id);
      logSb('delete', 'inventory_items', error, { id: editingItem.id });
      if (error) { console.error('[Supabase] 상품 삭제 실패:', error); return alert('삭제 오류: ' + error.message); }
      await loadInventory();
      render();
      closeModal();
    }

    const FLOOR_COLORS = ['#7F77DD', '#1D9E75', '#D4537E'];
    function getFloorColor(floor) {
      return FLOOR_COLORS[(floor - 1) % FLOOR_COLORS.length];
    }

    function render() {
      let html = '';
      const allFloors = getAllFloors();
      const displayFloors = allFloors.length > 0 ? allFloors : [1, 2, 3];

      ['A', 'B', 'C'].forEach(col => {
        let colHtml = `<div class="col-wrapper"><div class="col-header">${col}열</div><div class="cans-list">`;
        const maxCan = COL_MAX[col];
        for (let can = 1; can <= maxCan; can++) {
          const cd = inv[col][can];
          let rowsHtml = '';
          displayFloors.forEach(floor => {
            if (cd && cd[floor] && cd[floor].length > 0) {
              cd[floor].forEach((it, idx) => {
                const dateHtml = it.d ? ` <span class="fl-date">[${it.d}]</span>` : '';
                const expHtml = it.e ? `<div class="fl-exp">유통기한: ${it.e}</div>` : '';
                rowsHtml += `<div class="floor-line" onclick="openEditModal('${col}',${can},${floor},${idx})">
                  <span class="fl-floor" style="color:${getFloorColor(floor)};">${floor}층</span>
                  <div class="fl-name-col">
                    <span class="fl-name">${it.n}${dateHtml}</span>
                    ${expHtml}
                  </div>
                  <span class="fl-qty">${fmtQty(it.q)}개</span>
                </div>`;
              });
            } else {
              rowsHtml += `<div class="floor-line" onclick="openAddModalFloor('${col}',${can},${floor})">
                <span class="fl-floor" style="color:${getFloorColor(floor)};">${floor}층</span>
                <div class="fl-name-col"><span class="fl-name fl-empty">+ 추가</span></div>
                <span class="fl-qty fl-empty">-</span>
              </div>`;
            }
          });
          colHtml += `<div class="can-island"><div class="can-num">${col}${can}칸</div><div class="can-box">${rowsHtml}</div></div>`;
        }
        colHtml += `</div></div>`;
        html += colHtml;
      });

      document.getElementById('cols-container').innerHTML = html;
    }

    function getProductTotals() {
      const prod = {};
      let tot = 0;
      ['A','B','C'].forEach(col => {
        for (let c = 1; c <= 20; c++) {
          if (inv[col][c]) {
            for (let f = 1; f <= 10; f++) {
              if (inv[col][c][f]) {
                inv[col][c][f].forEach((it, idx) => {
                  if (!prod[it.n]) prod[it.n] = { qty: 0, locations: [] };
                  prod[it.n].qty = roundQty(prod[it.n].qty + it.q);
                  prod[it.n].locations.push({ col, can: c, floor: f, idx });
                  tot = roundQty(tot + it.q);
                });
              }
            }
          }
        }
      });
      return { prod, tot };
    }

    function sortEntries(entries, sortMode, dir, valueOf) {
      const sorted = entries.slice();
      const mult = dir === 'asc' ? 1 : -1;
      if (sortMode === 'name') sorted.sort((a, b) => mult * a[0].localeCompare(b[0], 'ko'));
      else sorted.sort((a, b) => mult * (valueOf(a[1]) - valueOf(b[1])));
      return sorted;
    }

    function updateSortDirLabel(btnId, dir) {
      document.getElementById(btnId).textContent = dir === 'desc' ? '↓ 내림' : '↑ 오름';
    }

    function getStockStatus(qty) {
      if (qty <= 10) return { color: '#E24B4A' };
      if (qty <= 50) return { color: '#639922' };
      return { color: '#378ADD' };
    }

    function renderStats() {
      const { prod, tot } = getProductTotals();
      const sortMode = document.getElementById('stats-sort').value;
      updateSortDirLabel('stats-sort-dir', statsSortDir);
      const entries = sortEntries(Object.entries(prod), sortMode, statsSortDir, data => data.qty);

      let html = `<div class="stats-summary-bar">
        <div class="stats-summary-count">전체 ${fmtQtyComma(tot)}개 · 종류 ${Object.keys(prod).length.toLocaleString()}</div>
        <div class="stats-legend">
          <span><span class="legend-dot" style="background:#E24B4A;"></span>부족 10개↓</span>
          <span><span class="legend-dot" style="background:#639922;"></span>적정 11~50</span>
          <span><span class="legend-dot" style="background:#378ADD;"></span>여유 51개↑</span>
        </div>
      </div>`;

      entries.forEach(([n, data]) => {
        const { color } = getStockStatus(data.qty);
        const chipsHtml = data.locations.map(loc => `<button class="loc-chip" onclick="openEditModal('${loc.col}',${loc.can},${loc.floor},${loc.idx})">
          <span class="loc-col">${loc.col}</span><span class="loc-dash">·</span><span class="loc-can">${loc.can}</span><span class="loc-dash">·</span><span class="loc-floor">${loc.floor}</span>
        </button>`).join('');
        html += `<div class="stock-card">
          <div class="stock-card-bar" style="background:${color};"></div>
          <div class="stock-card-body">
            <div class="stock-card-header">
              <span class="stock-card-name">${n}</span>
              <span class="stock-card-qty" style="color:${color};">${fmtQty(data.qty)}개</span>
            </div>
            <div class="loc-chips">${chipsHtml}</div>
          </div>
        </div>`;
      });
      document.getElementById('stats-content').innerHTML = html;
    }

    function getAvailableMonths() {
      const months = new Set();
      logs.forEach(l => { if (l.date) months.add(l.date.slice(0, 7)); });
      return Array.from(months).sort();
    }

    function getSelectedMonth() {
      const sel = document.getElementById('month-select');
      if (sel && sel.value) return sel.value;
      const months = getAvailableMonths();
      return months.length ? months[months.length - 1] : getTodayDate().slice(0, 7);
    }

    function getMonthlyProductStats(month) {
      const prod = {};
      logs.forEach(l => {
        if (!l.date || l.date.slice(0, 7) !== month) return;
        if (!prod[l.name]) prod[l.name] = { in: 0, out: 0 };
        if (l.type === '입고') prod[l.name].in = roundQty(prod[l.name].in + l.qty);
        else if (l.type === '출고') prod[l.name].out = roundQty(prod[l.name].out + l.qty);
      });
      return prod;
    }

    function renderMonthlyStats() {
      const months = getAvailableMonths();
      const sel = document.getElementById('month-select');
      const keep = sel.value;
      sel.innerHTML = months.length
        ? months.map(m => `<option value="${m}">${m}</option>`).join('')
        : '<option value="">데이터 없음</option>';
      sel.value = months.includes(keep) ? keep : (months[months.length - 1] || '');

      const month = sel.value;
      const sortMode = document.getElementById('monthly-sort').value;
      updateSortDirLabel('monthly-sort-dir', monthlySortDir);
      const prod = getMonthlyProductStats(month);
      const entries = sortEntries(Object.entries(prod), sortMode, monthlySortDir, v => v.in + v.out);

      let html = '';
      if (!month || entries.length === 0) {
        html = '<div style="color:#999; text-align:center; padding:20px;">해당 월의 입출고 기록이 없습니다</div>';
      } else {
        entries.forEach(([name, v]) => {
          html += `<div style="padding:15px;display:flex;justify-content:space-between;border-bottom:1px solid #ddd;font-size:16px;">
            <span>${name}</span>
            <span><span style="color:#28a745;font-weight:bold;">입고 ${fmtQty(v.in)}</span> / <span style="color:#e8590c;font-weight:bold;">출고 ${fmtQty(v.out)}</span></span>
          </div>`;
        });
      }
      document.getElementById('monthly-stats-content').innerHTML = html;
    }

    function setLogTypeFilter(type, btn) {
      logTypeFilter = type;
      document.querySelectorAll('.log-type-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderLogs();
    }

    function toggleLogSortDir() {
      logSortDir = logSortDir === 'desc' ? 'asc' : 'desc';
      renderLogs();
    }

    function updateLogSortDirLabel() {
      document.getElementById('log-sort-dir').textContent = logSortDir === 'desc' ? '↓ 최신순' : '↑ 오래된순';
    }

    function getFilteredSortedLogs() {
      const from = document.getElementById('log-date-from').value;
      const to = document.getElementById('log-date-to').value;
      const filtered = logs.filter(l => {
        if (logTypeFilter !== 'all' && l.type !== logTypeFilter) return false;
        if (from && (!l.date || l.date < from)) return false;
        if (to && (!l.date || l.date > to)) return false;
        return true;
      });
      const mult = logSortDir === 'asc' ? 1 : -1;
      filtered.sort((a, b) => mult * ((a.date || '').localeCompare(b.date || '')) || mult * (a.id - b.id));
      return filtered;
    }

    function renderLogs() {
      updateLogSortDirLabel();
      const filtered = getFilteredSortedLogs();
      let html = '';
      if (logs.length === 0) {
        html = '<div style="color: #999; text-align: center; padding: 20px;">로그가 없습니다</div>';
      } else {
        html += `<button onclick="clearLogs()" style="background:#dc3545; margin-bottom:15px;">전체 삭제</button>`;
        if (filtered.length === 0) {
          html += '<div style="color: #999; text-align: center; padding: 20px;">조건에 맞는 로그가 없습니다</div>';
        } else {
          filtered.forEach(log => {
            let icon, color, lineHtml;
            if (log.type === '이동') {
              icon = '🔀';
              color = '#6f42c1';
              lineHtml = `${icon} 이동: <span class="log-loc-col">${log.fromCol}</span>열 <span class="log-loc-can">${log.fromCan}</span>칸 <span class="log-loc-floor">${log.fromFloor}</span>층 → <span class="log-loc-col">${log.col}</span>열 <span class="log-loc-can">${log.can}</span>칸 <span class="log-loc-floor">${log.floor}</span>층 - <span class="log-item-name">${log.name}</span>`;
            } else if (log.type === '출고취소') {
              icon = '↩️';
              color = '#0ea5e9';
              lineHtml = `${icon} 출고취소: <span class="log-loc-col">${log.col}</span>열 <span class="log-loc-can">${log.can}</span>칸 <span class="log-loc-floor">${log.floor}</span>층 - <span class="log-item-name">${log.name}</span>`;
            } else {
              icon = log.type === '입고' ? '📥' : '📤';
              color = log.type === '입고' ? '#28a745' : '#ffc107';
              lineHtml = `${icon} ${log.type}: <span class="log-loc-col">${log.col}</span>열 <span class="log-loc-can">${log.can}</span>칸 <span class="log-loc-floor">${log.floor}</span>층 - <span class="log-item-name">${log.name}</span>`;
            }
            html += `<div class="log-entry" style="border-left-color: ${color};">
              <div class="log-first-line">
                <span>${lineHtml}</span>
                <button class="log-del" onclick="deleteLog(${log.id})">삭제</button>
              </div>
              <div>수량: <span class="log-qty">${fmtQty(log.qty)}개</span></div>
              <div class="log-date">${log.date}</div>
            </div>`;
          });
        }
      }
      document.getElementById('logs-content').innerHTML = html;
    }

    async function deleteLog(id) {
      if (!confirm('이 로그를 삭제할까요?')) return;
      const { error } = await sb.from('inventory_logs').delete().eq('id', id);
      if (error) return alert('삭제 오류: ' + error.message);
      await loadLogs();
      renderLogs();
    }

    async function clearLogs() {
      if (!confirm('로그 전체를 삭제할까요?')) return;
      const { error } = await sb.from('inventory_logs').delete().gte('id', 0);
      if (error) return alert('삭제 오류: ' + error.message);
      await loadLogs();
      renderLogs();
    }

    // 출고표 위치 표시: "B열 1칸 1층" 형식 (층 색상은 기존 1/2/3층 색을 그대로 사용)
    function shipLocHtml(r) {
      const fc = getFloorColor(r.floor);
      return `<span class="log-loc-col">${r.col}</span>열 <span class="log-loc-can">${r.can}</span>칸 <span style="color:${fc};">${r.floor}</span>층`;
    }
    function shipLocText(r) {
      return `${r.col}열 ${r.can}칸 ${r.floor}층`;
    }

    // ===== 출고표 탭: 상품 검색 후 바로 출고표에 추가 =====
    let shipSearchOpenId = null; // 수량 입력칸이 열려 있는 재고 id
    let shipSearchBusy = false;

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    // 재고 id로 현재 위치/상품을 찾는다 (실시간 갱신으로 순서가 바뀌어도 안전)
    function findInvItemById(id) {
      for (const col of Object.keys(inv)) {
        for (const can of Object.keys(inv[col])) {
          for (const floor of Object.keys(inv[col][can])) {
            const item = inv[col][can][floor].find(it => it.id === id);
            if (item) return { col, can: parseInt(can), floor: parseInt(floor), id, item };
          }
        }
      }
      return null;
    }

    // 전체 재고를 위치별 한 줄씩 펼친다: [{ col, can, floor, id, name, qty }]
    function listInvRows() {
      const rows = [];
      Object.keys(inv).forEach(col => Object.keys(inv[col]).forEach(can => Object.keys(inv[col][can]).forEach(floor => {
        inv[col][can][floor].forEach(it => rows.push({ col, can: parseInt(can), floor: parseInt(floor), id: it.id, name: it.n, qty: it.q, exp: it.e || null }));
      })));
      return rows;
    }

    function onShipSearchInput() {
      shipSearchOpenId = null;
      renderShipSearch();
    }

    function renderShipSearch() {
      const box = document.getElementById('ship-search-results');
      const q = document.getElementById('ship-search-input').value.trim().toLowerCase();
      if (!q) { box.innerHTML = ''; return; }

      // 실시간 갱신으로 다시 그려도 입력 중이던 수량은 유지
      const prevQtyInput = document.getElementById('ship-search-qty');
      const prevQty = prevQtyInput ? prevQtyInput.value : '';

      const rows = listInvRows().filter(r => r.name.toLowerCase().includes(q));

      if (rows.length === 0) { box.innerHTML = '<div class="ship-sr-empty">재고에 없는 상품이에요</div>'; return; }
      if (shipSearchOpenId !== null && !rows.some(r => r.id === shipSearchOpenId)) shipSearchOpenId = null;

      // 위치순 정렬 (열 → 칸 숫자순 → 층)
      box.innerHTML = sortShippingRows(rows).map(r => {
        const open = r.id === shipSearchOpenId;
        return `<div class="ship-sr${open ? ' open' : ''}" style="border-left-color:${getFloorColor(r.floor)};">
          <div class="ship-sr-line" onclick="toggleShipSearchRow(${r.id})">
            <span class="ship-loc">${shipLocHtml(r)}</span>
            <span class="ship-name">${escapeHtml(r.name)}</span>
            <span class="ship-sr-stock">재고 ${fmtQty(r.qty)}개</span>
          </div>
          ${open ? `<div class="ship-sr-form">
            <input type="number" id="ship-search-qty" inputmode="decimal" placeholder="출고 수량" min="0.01" step="0.01" value="${escapeHtml(prevQty)}" onkeydown="if(event.key==='Enter')addShipFromSearch(${r.id})">
            <button onclick="addShipFromSearch(${r.id})">출고표에 추가</button>
          </div>` : ''}
        </div>`;
      }).join('');
    }

    // 한 줄을 누르면 그 줄 아래에 수량 입력칸을 연다 (다른 줄의 입력칸은 닫힘)
    function toggleShipSearchRow(id) {
      const opening = shipSearchOpenId !== id;
      shipSearchOpenId = opening ? id : null;
      const prev = document.getElementById('ship-search-qty');
      if (prev) prev.value = '';
      renderShipSearch();
      if (opening) document.getElementById('ship-search-qty').focus();
    }

    async function addShipFromSearch(id) {
      if (shipSearchBusy) return;
      const found = findInvItemById(id);
      if (!found) {
        shipSearchOpenId = null;
        renderShipSearch();
        return alert('재고에서 상품을 찾을 수 없습니다 (이미 삭제되었을 수 있어요)');
      }
      const { item } = found;
      const qty = readQtyInput('ship-search-qty');
      if (qty === null) return alert('출고표 수량을 0보다 큰 숫자로 입력해주세요 (소수점 두 자리까지)');
      if (qty > item.q) return alert(`재고가 부족합니다 (현재 재고 ${fmtQty(item.q)}개)`);

      shipSearchBusy = true;
      try {
        const result = await addToShippingSheet(item, qty, found);
        if (result.shipErr) return;
        // 추가 후에는 입력칸을 닫고, 검색어는 그대로 두고 줄어든 재고로 다시 그린다
        const qtyInput = document.getElementById('ship-search-qty');
        if (qtyInput) qtyInput.value = '';
        shipSearchOpenId = null;
        renderShipSearch();
        alertShipResult(result);
      } finally {
        shipSearchBusy = false;
      }
    }

    // ===== 사장님 출고 사진 → 출고표 자동 입력 =====
    // 사진은 Supabase Edge Function(read-shipping-photo)으로 보내고,
    // 그 안에서 제미나이가 표를 읽는다. (제미나이 키는 Supabase Secrets 에만 있음)
    const PHOTO_FUNCTION_NAME = 'read-shipping-photo';
    const PHOTO_MAX_SIDE = 1600; // 긴 변 기준 px. 글씨는 읽히면서 전송은 빠른 크기
    let photoReview = null;      // 확인 화면 상태 { rows, aliasError } (null 이면 닫힘)
    let photoBusy = false;

    function setPhotoStatus(text, isErr) {
      const el = document.getElementById('ship-photo-status');
      el.textContent = text;
      el.classList.toggle('err', !!isErr);
    }

    // 이미지를 긴 변 PHOTO_MAX_SIDE 이하 JPEG 로 줄여서 base64(접두어 없이)로 돌려준다
    function shrinkImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          const scale = Math.min(1, PHOTO_MAX_SIDE / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff'; // 투명 PNG(캡처 이미지) 배경을 흰색으로
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.85).split(',')[1]);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이미지를 열 수 없어요 (jpg/png 사진으로 올려 주세요)')); };
        img.src = url;
      });
    }

    function onShipPhotoFile(e) {
      const file = e.target.files && e.target.files[0];
      e.target.value = ''; // 같은 사진을 다시 골라도 동작하도록
      if (file) handleShipPhoto(file);
    }

    async function describeFunctionError(error) {
      const res = error && error.context;
      if (res && res.status === 404) return `Edge Function(${PHOTO_FUNCTION_NAME})이 아직 배포되지 않았어요`;
      try {
        if (res && typeof res.json === 'function') {
          const body = await res.json();
          if (body && body.error) return body.error;
        }
      } catch (e) { /* 본문이 JSON 이 아니면 아래 기본 문구 사용 */ }
      return (error && error.message) || '사진 읽기 요청에 실패했어요';
    }

    async function handleShipPhoto(file) {
      if (photoBusy) return;
      if (!file.type || !file.type.startsWith('image/')) return alert('이미지 파일만 올릴 수 있어요');
      if (photoReview && !confirm('확인 중인 사진 결과가 있어요. 새 사진으로 바꿀까요?')) return;

      photoBusy = true;
      photoReview = null;
      renderPhotoReview();
      setPhotoStatus('⏳ 사진 읽는 중... (10~30초 정도 걸려요)');
      try {
        const image = await shrinkImage(file);
        const { data, error } = await sb.functions.invoke(PHOTO_FUNCTION_NAME, { body: { image, mimeType: 'image/jpeg' } });
        console.log('[사진 출고표] Edge Function 응답:', data, error);
        if (error) throw new Error(await describeFunctionError(error));
        if (data && data.error) throw new Error(data.error);
        const items = (data && data.items) || [];
        if (items.length === 0) throw new Error('사진에서 출고 항목을 찾지 못했어요. 표가 잘 보이게 다시 찍어 주세요.');

        const { aliases, error: aliasError } = await loadNameAliases();
        photoReview = { groups: buildPhotoGroups(items, aliases), aliasError };
        setPhotoStatus('');
        renderPhotoReview();
      } catch (err) {
        console.error('[사진 출고표] 실패:', err);
        setPhotoStatus('❌ ' + err.message, true);
      } finally {
        photoBusy = false;
      }
    }

    // 이름 짝 기억 테이블: { 정규화된 사장님제품명: 재고상품명 }
    // (띄어쓰기·용량 표기 차이가 있어도 같은 짝으로 찾도록 키를 정규화한다)
    async function loadNameAliases() {
      const { data, error } = await sb.from('name_alias').select('sheet_name, item_name');
      logSb('select', 'name_alias', error, data);
      const aliases = {};
      (data || []).forEach(r => { aliases[sheetKey(r.sheet_name)] = r.item_name; });
      return { aliases, error };
    }

    // 비교용: 공백 제거 + 소문자
    function normName(s) {
      return String(s || '').replace(/\s+/g, '').toLowerCase();
    }

    // 사장님 제품명에서 용량 표기([600㎖] 등)를 뺀다
    function stripCapacity(s) {
      return String(s || '').replace(/\[[^\]]*\]/g, ' ');
    }

    // 이름 짝 찾기용 키: 용량 표기·띄어쓰기 무시
    function sheetKey(s) {
      return normName(stripCapacity(s));
    }

    // 괄호 안의 제품 번호 (예: "칼라 컬러크림 (6/04)" → ["6/04"])
    function sheetCodes(s) {
      const codes = [];
      stripCapacity(s).replace(/\(([^)]*)\)/g, (m, inner) => {
        const v = normName(inner);
        if (/^\d+\/\d+$/.test(v)) codes.push(v);
        return m;
      });
      return codes;
    }

    // 핵심어: 괄호·공백으로 나눈 낱말 (예: "칼라 볼륨 매직 (2제) (크림)" → 칼라, 볼륨, 매직, 2제, 크림)
    function sheetWords(s) {
      return stripCapacity(s).split(/[\s()]+/).map(normName).filter(Boolean);
    }

    // 재고 상품명이 사장님 제품명의 핵심어와 맞는지
    // - 낱말 하나와 정확히 같으면 매칭
    // - 세 글자 이상이면 붙여 쓴 이름 안에 들어 있어도 매칭 (예: "매직1제" ⊂ "칼라볼륨매직1제")
    // - 두 글자 이하("크림")는 낱말이 정확히 같을 때만 ("컬러크림"의 일부로는 매칭 안 함)
    function matchesCoreWord(itemName, words, joined) {
      const n = normName(itemName);
      if (!n) return false;
      if (words.includes(n)) return true;
      return n.length >= 3 && joined.includes(n);
    }

    // 사진 한 줄의 제품명 → 재고 상품명 결정 (애매하면 null = 선택필요)
    // 1) 이름 짝 기억  2) 괄호 안 번호와 정확히 같은 재고  3) 핵심어가 맞는 재고
    function resolveProductName(it, aliases, all) {
      const aliasName = aliases[sheetKey(it.name)];
      if (aliasName && all.some(r => r.name === aliasName)) return { itemName: aliasName, nameCandidates: [] };

      let pool;
      const codes = sheetCodes(it.name);
      if (codes.length > 0) {
        // 번호가 있으면 그 번호와 정확히 같은 재고만. 없으면 다른 상품으로 대체하지 않는다.
        pool = all.filter(r => codes.includes(normName(r.name)));
      } else {
        const words = sheetWords(it.name);
        const joined = words.join('');
        pool = all.filter(r => matchesCoreWord(r.name, words, joined));
      }
      const names = distinctNames(pool);
      if (names.length === 1) return { itemName: names[0], nameCandidates: [] };
      return { itemName: null, nameCandidates: sortShippingRows(pool) };
    }

    function distinctNames(rows) {
      return Array.from(new Set(rows.map(r => r.name)));
    }

    // 사진에 적힌 위치 (하나도 없으면 null)
    function photoLocOf(it) {
      return (it.col || it.can || it.floor) ? { col: it.col || null, can: it.can || null, floor: it.floor || null } : null;
    }
    function atPhotoLoc(r, loc) {
      return (!loc.col || r.col === loc.col) && (!loc.can || r.can === loc.can) && (!loc.floor || r.floor === loc.floor);
    }

    // 자동 배정 순서: 유통기한 빠른 곳 → (같거나 없으면) 수량 적은 곳 → 위치순
    function allocOrder(a, b) {
      const ea = a.exp || '9999-99-99', eb = b.exp || '9999-99-99';
      if (ea !== eb) return ea < eb ? -1 : 1;
      if (a.avail !== b.avail) return a.avail - b.avail;
      return sortShippingRows([a, b])[0] === a ? -1 : 1;
    }

    // 상품 하나를 qty 만큼 재고 위치에 배정한다.
    // used: 다른 줄들이 이미 가져간 수량 { 재고id → 수량 } (같은 상품이 여러 줄에 있을 때 겹치지 않게)
    // 결과 lines: [{ id, qty, kind }]  kind = 'green'(사진 위치 / 한 곳뿐) | 'yellow'(자동 배정)
    function allocateProduct(itemName, qty, prefLoc, used) {
      const rows = listInvRows()
        .filter(r => r.name === itemName)
        .map(r => ({ ...r, avail: roundQty(r.qty - (used.get(r.id) || 0)) }))
        .filter(r => r.avail > 0);
      const pref = prefLoc ? rows.filter(r => atPhotoLoc(r, prefLoc)).sort(allocOrder) : [];
      const rest = rows.filter(r => !pref.includes(r)).sort(allocOrder);
      const onlyOnePlace = !prefLoc && rows.length === 1;

      const lines = [];
      let remaining = qty;
      [...pref, ...rest].forEach(r => {
        if (remaining <= 0) return;
        const take = roundQty(Math.min(r.avail, remaining));
        remaining = roundQty(remaining - take);
        lines.push({ id: r.id, qty: take, kind: (pref.includes(r) || onlyOnePlace) ? 'green' : 'yellow' });
      });
      return { lines, shortage: roundQty(Math.max(0, remaining)) };
    }

    function addUsed(used, lines) {
      lines.forEach(l => used.set(l.id, roundQty((used.get(l.id) || 0) + l.qty)));
    }

    // 사진 한 줄(사장님 표의 한 행) = 그룹 하나. 배정 결과에 따라 위치별 줄(lines)로 나뉜다.
    function buildPhotoGroups(items, aliases) {
      const all = listInvRows();
      const used = new Map();
      return items.map(it => {
        const { itemName, nameCandidates } = resolveProductName(it, aliases, all);
        const group = {
          sheetName: it.name,
          sheetLoc: photoLocOf(it),
          prefLoc: photoLocOf(it), // 배정할 때 먼저 쓰는 위치 (직접 고르면 그 위치로 바뀜)
          qtyText: fmtQty(it.qty),
          itemName,
          nameCandidates,
          namePicked: false, // 상품을 직접 골랐는지 (이름 짝 기억 대상)
          remember: true,
          lines: [],
          shortage: 0
        };
        allocateGroup(group, used);
        addUsed(used, group.lines);
        return group;
      });
    }

    function allocateGroup(group, used) {
      const qty = parseQtyValue(group.qtyText);
      if (!group.itemName || qty === null) { group.lines = []; group.shortage = 0; return; }
      const { lines, shortage } = allocateProduct(group.itemName, qty, group.prefLoc, used);
      group.lines = lines;
      group.shortage = shortage;
    }

    // 그룹 하나만 다시 배정 (다른 그룹이 가져간 수량은 빼고)
    function reallocateGroup(g) {
      const used = new Map();
      photoReview.groups.forEach((other, k) => { if (k !== g) addUsed(used, other.lines); });
      allocateGroup(photoReview.groups[g], used);
    }

    // 확인 화면 검사
    //  - unresolved: 상품을 못 정한 줄 (선택필요)
    //  - shortage: 모든 위치를 합쳐도 재고 부족
    //  - badQty: 박스 수가 비었거나 0 이하
    //  - over: 위치를 직접 바꿔서 한 위치에서 재고보다 많이 빼게 된 줄
    function photoReviewCheck() {
      const byId = new Map(listInvRows().map(r => [r.id, r]));
      const totals = new Map();
      photoReview.groups.forEach(g => addUsed(totals, g.lines));
      const groups = photoReview.groups.map(g => {
        const x = {
          badQty: parseQtyValue(g.qtyText) === null,
          unresolved: !g.itemName,
          shortage: g.shortage,
          lines: g.lines.map(l => {
            const item = byId.get(l.id) || null;
            const total = totals.get(l.id) || 0;
            return { item, total, over: !item || total > item.qty };
          })
        };
        x.red = x.unresolved || x.badQty || x.shortage > 0 || x.lines.some(l => l.over);
        return x;
      });
      const lineCount = photoReview.groups.reduce((n, g) => n + g.lines.length, 0);
      return {
        groups,
        lineCount,
        redCount: groups.filter(x => x.red).length,
        unresolvedCount: groups.filter(x => x.unresolved).length,
        shortageCount: groups.filter(x => x.shortage > 0).length,
        badQtyCount: groups.filter(x => x.badQty && !x.unresolved).length,
        overCount: groups.reduce((n, x) => n + x.lines.filter(l => l.over).length, 0)
      };
    }

    function prBadge(color, text) {
      return `<span class="pt-badge ${color}">${text}</span>`;
    }

    function renderPhotoReview() {
      const box = document.getElementById('ship-photo-review');
      if (!photoReview) { box.innerHTML = ''; return; }

      const all = sortShippingRows(listInvRows());
      const byId = new Map(all.map(r => [r.id, r]));
      const check = photoReviewCheck();
      // 위치 선택칸 (같은 상품의 위치만, 위치만 표시)
      // 화살표(⌄)는 별도 요소. pointer-events:none 이라 화살표를 눌러도 선택칸이 열린다
      const selectWrap = (onchange, optionsHtml) => `<div class="pt-select-wrap"><select class="pt-select" onchange="${onchange}">${optionsHtml}</select><span class="pt-arrow">⌄</span></div>`;
      const locSelect = (rows, selectedId, onchange) => selectWrap(onchange,
        rows.map(r => `<option value="${r.id}"${r.id === selectedId ? ' selected' : ''}>${escapeHtml(shipLocText(r))}</option>`).join(''));

      let body = '';
      let qtySum = 0;
      photoReview.groups.forEach((group, g) => {
        const gx = check.groups[g];
        const q = parseQtyValue(group.qtyText);
        if (q !== null) qtySum = roundQty(qtySum + q);

        // 제품 칸: 매칭된 재고 상품명 (마우스 올리면 사장님 원래 표기). 아직 못 정했으면 사장님 표기를 빨간 글씨로
        const nameCell = group.itemName
          ? `<td class="pt-name" title="${escapeHtml(group.sheetName)}"><div class="pt-ellipsis">${escapeHtml(group.itemName)}</div></td>`
          : `<td class="pt-name" title="${escapeHtml(group.sheetName)}"><div class="pt-ellipsis pt-unmatched">${escapeHtml(group.sheetName)}</div></td>`;
        const qtyCell = `<td class="pt-num pt-fill"><input type="text" class="pt-qty" id="pr-qty-${g}" inputmode="decimal" autocomplete="off" value="${escapeHtml(group.qtyText)}" oninput="onPhotoQtyInput(${g}, this.value)" onblur="onPhotoQtyBlur(${g})"></td>`;
        const remember = group.namePicked
          ? `<label class="pt-remember"><input type="checkbox"${group.remember ? ' checked' : ''} onchange="photoReview.groups[${g}].remember = this.checked"> 다음부터 자동으로 맞추기</label>`
          : '';
        const groupRedBadge = gx.unresolved ? prBadge('red', '선택필요')
          : gx.badQty ? prBadge('red', '박스 확인')
          : gx.shortage > 0 ? prBadge('red', `재고부족 ${fmtQty(gx.shortage)}`)
          : '';

        // 상품을 못 정한 줄: 위치 칸에서 재고를 직접 고른다 (같은 위치에 여러 상품이 있을 수 있어 상품명도 함께 표시)
        if (gx.unresolved || group.lines.length === 0) {
          const opt = r => `<option value="${r.id}">${escapeHtml(`${shipLocText(r)} · ${r.name}`)}</option>`;
          const locCell = gx.unresolved
            ? selectWrap(`onPhotoPickProduct(${g}, this.value)`,
                `<option value="">선택</option>` +
                (group.nameCandidates.length > 0 ? `<optgroup label="후보">${group.nameCandidates.map(opt).join('')}</optgroup>` : '') +
                `<optgroup label="전체 재고">${all.map(opt).join('')}</optgroup>`)
            : '-';
          body += `<tr class="red">${nameCell}${qtyCell}<td class="${gx.unresolved ? 'pt-fill' : ''}">${locCell}</td><td class="pt-num">-</td><td>${groupRedBadge || prBadge('red', '선택필요')}${remember}</td></tr>`;
          return;
        }

        const sameProduct = all.filter(r => r.name === group.itemName);
        const lineCells = group.lines.map((line, l) => {
          const item = byId.get(line.id);
          const lx = gx.lines[l];
          const editable = line.kind === 'yellow' || line.kind === 'manual';
          const options = item && !sameProduct.includes(item) ? [item, ...sameProduct] : sameProduct;
          return {
            name: item ? item.name : group.itemName,
            editable,
            loc: editable ? locSelect(options, line.id, `onPhotoPickLine(${g}, ${l}, this.value)`) : escapeHtml(item ? shipLocText(item) : '-'),
            stock: item ? fmtQty(item.qty) : '-',
            badge: lx.over ? prBadge('red', '재고초과') : line.kind === 'yellow' ? prBadge('yellow', '자동배정') : prBadge('green', '매칭'),
            yellow: line.kind === 'yellow'
          };
        });

        if (lineCells.length === 1) {
          const c = lineCells[0];
          const cls = gx.red ? 'red' : c.yellow ? 'yellow' : '';
          body += `<tr class="${cls}">${nameCell}${qtyCell}<td class="${c.editable ? 'pt-fill' : ''}">${c.loc}</td><td class="pt-num">${c.stock}</td><td>${groupRedBadge || c.badge}${remember}</td></tr>`;
        } else {
          // 여러 위치에서 나눠 빼는 경우: 제품 줄 + 위치별 줄
          const anyYellow = lineCells.some(c => c.yellow);
          const cls = gx.red ? 'red' : anyYellow ? 'yellow' : '';
          const headBadge = groupRedBadge || (gx.red ? prBadge('red', '재고초과') : anyYellow ? prBadge('yellow', '자동배정') : prBadge('green', '매칭'));
          body += `<tr class="${cls}">${nameCell}${qtyCell}<td class="pt-muted">${lineCells.length}곳에서 나눠 빼기</td><td class="pt-num">-</td><td>${headBadge}${remember}</td></tr>`;
          lineCells.forEach((c, l) => {
            body += `<tr class="pt-sub ${cls}"><td class="pt-name" title="${escapeHtml(group.sheetName)}"><div class="pt-ellipsis pt-muted">↳ ${escapeHtml(c.name)}</div></td><td class="pt-num">${fmtQty(group.lines[l].qty)}</td><td class="${c.editable ? 'pt-fill' : ''}">${c.loc}</td><td class="pt-num">${c.stock}</td><td>${c.badge}</td></tr>`;
          });
        }
      });

      let html = `<div class="pr-card">
        <div class="pr-title">📷 사진에서 읽은 출고 목록</div>`;
      if (photoReview.aliasError) {
        html += `<div class="pr-block-msg" style="margin-bottom:8px;">이름 짝 기억 테이블(name_alias)을 읽지 못했어요. supabase_update_name_alias.sql 을 실행해 주세요.</div>`;
      }
      html += `<div class="pt-wrap"><table class="pt-table">
          <thead><tr><th>제품</th><th>박스</th><th>위치</th><th>재고</th><th>상태</th></tr></thead>
          <tbody>${body}</tbody>
          <tfoot><tr><td>합계</td><td class="pt-num">${fmtQty(qtySum)}</td><td colspan="3">${photoReview.groups.length}건 · 선택필요 ${check.redCount}건</td></tr></tfoot>
        </table></div>
        <div class="pr-footer">
          <div class="pr-block-msg" id="pr-block-msg"></div>
          <button type="button" class="pr-add" id="pr-add-btn" onclick="confirmPhotoReview()">✅ 전체 출고표에 추가</button>
          <button type="button" class="pr-cancel" onclick="cancelPhotoReview()">취소</button>
        </div>
      </div>`;
      box.innerHTML = html;
      updatePhotoReviewStatus();
    }

    // 추가 버튼 상태 / 막힌 이유 (노란 줄은 막지 않음)
    function updatePhotoReviewStatus() {
      if (!photoReview) return;
      const check = photoReviewCheck();
      let msg = '';
      if (check.unresolvedCount > 0) msg = `빨간 항목 ${check.unresolvedCount}건 먼저 골라주세요`;
      else if (check.shortageCount > 0) msg = `재고 부족 항목 ${check.shortageCount}건: 박스 수를 줄이거나 재고를 확인해 주세요`;
      else if (check.badQtyCount > 0) msg = `박스 수가 비었거나 0 이하인 항목 ${check.badQtyCount}건을 고쳐주세요`;
      else if (check.overCount > 0) msg = `재고보다 많이 빼는 위치 ${check.overCount}곳을 고쳐주세요`;
      document.getElementById('pr-block-msg').textContent = msg;
      const btn = document.getElementById('pr-add-btn');
      btn.disabled = !!msg || photoBusy;
      btn.textContent = photoBusy ? '⏳ 추가 중...' : `✅ 전체 출고표에 추가 (${check.lineCount}건)`;
    }

    // 박스 수를 바꾸면 그 줄을 다시 배정하고, 입력칸 포커스는 유지
    function onPhotoQtyInput(g, value) {
      photoReview.groups[g].qtyText = value;
      reallocateGroup(g);
      renderPhotoReview();
      const input = document.getElementById('pr-qty-' + g);
      if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
    }

    // 입력을 마치면 소수점 두 자리로 맞춘다 (다시 그리지 않음 → 버튼 클릭이 끊기지 않게)
    function onPhotoQtyBlur(g) {
      if (!photoReview) return;
      const group = photoReview.groups[g];
      const v = parseQtyValue(group.qtyText);
      if (v === null) return;
      group.qtyText = fmtQty(v);
      const input = document.getElementById('pr-qty-' + g);
      if (input) input.value = group.qtyText;
    }

    // 선택필요 줄에서 재고를 고름 → 그 상품으로, 고른 위치를 먼저 쓰도록 배정
    function onPhotoPickProduct(g, value) {
      const group = photoReview.groups[g];
      const row = value === '' ? null : listInvRows().find(r => r.id === Number(value));
      group.itemName = row ? row.name : null;
      group.prefLoc = row ? { col: row.col, can: row.can, floor: row.floor } : group.sheetLoc;
      group.namePicked = !!row;
      reallocateGroup(g);
      renderPhotoReview();
    }

    // 위치 선택칸을 바꿈 → 그 줄만 고른 위치로 (직접 선택)
    function onPhotoPickLine(g, l, value) {
      const group = photoReview.groups[g];
      const row = listInvRows().find(r => r.id === Number(value));
      if (!row) return;
      if (row.name !== group.itemName) { onPhotoPickProduct(g, value); return; }
      group.lines[l] = { id: row.id, qty: group.lines[l].qty, kind: 'manual' };
      renderPhotoReview();
    }

    function cancelPhotoReview() {
      if (photoBusy) return;
      photoReview = null;
      renderPhotoReview();
      setPhotoStatus('');
    }

    // "전체 출고표에 추가": 바로 차감 (빨간 항목이 있으면 막힘)
    async function confirmPhotoReview() {
      if (!photoReview || photoBusy) return;
      const check = photoReviewCheck();
      if (check.unresolvedCount || check.shortageCount || check.badQtyCount || check.overCount) return updatePhotoReviewStatus();
      const groups = photoReview.groups;

      photoBusy = true;
      updatePhotoReviewStatus();
      try {
        // 1) 직접 고른 이름 짝 저장 (재고 소진으로 상품이 삭제되기 전에 이름을 기록)
        const aliasMap = new Map();
        groups.forEach(g => { if (g.namePicked && g.remember && g.itemName) aliasMap.set(g.sheetName, g.itemName); });
        let aliasErr = null;
        if (aliasMap.size > 0) {
          const aliasRows = Array.from(aliasMap, ([sheet_name, item_name]) => ({ sheet_name, item_name }));
          const { error } = await sb.from('name_alias').upsert(aliasRows, { onConflict: 'sheet_name' });
          logSb('upsert', 'name_alias', error, aliasRows);
          aliasErr = error;
        }

        // 2) 위치 줄마다 기존 "출고표입력"과 같은 함수로 처리
        //    (출고표 기록 → 재고 차감, 0이면 삭제 → '출고' 로그)
        let okCount = 0;
        let okQty = 0;
        const fails = [];
        for (const group of groups) {
          for (const line of group.lines) {
            const name = group.itemName || group.sheetName;
            const found = findInvItemById(line.id); // 앞 줄 처리로 재고가 바뀌었을 수 있어 매번 새로 찾는다
            if (!found) { fails.push(`${name}: 재고에서 상품이 사라졌어요`); continue; }
            const where = shipLocText(found);
            if (line.qty > found.item.q) { fails.push(`${name} (${where}): 재고 부족 (현재 ${fmtQty(found.item.q)}개)`); continue; }
            const result = await addToShippingSheet(found.item, line.qty, found);
            if (result.shipErr) { fails.push(`${name} (${where}): 출고표 기록 실패`); continue; }
            if (result.error) { fails.push(`${name} (${where}): 출고표엔 기록됐지만 재고 차감 실패 (${result.error.message})`); continue; }
            if (result.logErr) fails.push(`${name} (${where}): 로그 저장 실패 (출고표·재고는 반영됨)`);
            okCount++;
            okQty = roundQty(okQty + line.qty);
          }
        }

        photoReview = null;
        renderPhotoReview();
        let msg = `${okCount}건, ${fmtQty(okQty)}박스 차감 완료`;
        if (fails.length > 0) msg += `\n\n확인이 필요한 항목:\n- ${fails.join('\n- ')}`;
        if (aliasErr) msg += `\n\n(이름 짝 저장 실패: ${aliasErr.message})`;
        alert(msg);
      } finally {
        photoBusy = false;
        updatePhotoReviewStatus();
      }
    }

    // PC: 출고표 탭을 보고 있을 때 Ctrl+V 로 클립보드 이미지 올리기
    document.addEventListener('paste', (e) => {
      if (!document.getElementById('ship').classList.contains('active')) return;
      if (document.getElementById('editModal').classList.contains('active')) return;
      const imageItem = Array.from((e.clipboardData && e.clipboardData.items) || [])
        .find(it => it.kind === 'file' && it.type.startsWith('image/'));
      if (!imageItem) return; // 글자 붙여넣기는 평소대로
      e.preventDefault();
      handleShipPhoto(imageItem.getAsFile());
    });

    // 올리기 영역에 이미지 끌어다 놓기
    (function setupShipPhotoDrop() {
      const zone = document.getElementById('ship-photo-drop');
      ['dragenter', 'dragover'].forEach(ev => zone.addEventListener(ev, (e) => { e.preventDefault(); zone.classList.add('dragover'); }));
      ['dragleave', 'drop'].forEach(ev => zone.addEventListener(ev, (e) => { e.preventDefault(); zone.classList.remove('dragover'); }));
      zone.addEventListener('drop', (e) => {
        const file = Array.from((e.dataTransfer && e.dataTransfer.files) || []).find(f => f.type.startsWith('image/'));
        if (file) handleShipPhoto(file); else alert('이미지 파일을 끌어다 놓아 주세요');
      });
      // 영역 밖에 잘못 놓아도 브라우저가 사진을 열어버리지 않도록
      window.addEventListener('dragover', (e) => e.preventDefault());
      window.addEventListener('drop', (e) => e.preventDefault());
    })();

    function renderShippingSheet() {
      if (shippingSheetError) {
        document.getElementById('ship-content').innerHTML =
          `<div style="color:#b02a37; background:#fff5f5; border:1px solid #f1c0c4; border-radius:8px; padding:16px; line-height:1.6;">
            출고표 테이블(shipping_sheet)을 읽을 수 없습니다.<br>
            <b>supabase_update_2026-10-01.sql</b> 파일을 Supabase SQL Editor에서 한 번 실행해 주세요.<br>
            <span style="color:#888; font-size:13px;">(오류: ${shippingSheetError})</span>
          </div>`;
        return;
      }
      const rows = sortShippingRows(shippingSheet);
      let html = '';
      if (rows.length === 0) {
        html = '<div style="color:#999; text-align:center; padding:20px;">출고표가 비어 있습니다</div>';
      } else {
        const total = rows.reduce((sum, r) => roundQty(sum + Number(r.qty)), 0);
        html += `<div class="stats-summary-bar"><div class="stats-summary-count">${rows.length}건 · 합계 ${fmtQtyComma(total)}개</div></div>`;
        const checked = loadShipChecked();
        html += '<div class="ship-list">';
        rows.forEach(r => {
          const fc = getFloorColor(r.floor);
          const editing = shipEditId === r.id;
          const qtyCell = editing
            ? `<input type="text" inputmode="decimal" class="ship-qty-input" id="ship-qty-input-${r.id}" value="${shipEditDraft}" oninput="shipEditDraft = this.value; this.classList.remove('invalid')" onkeydown="if (event.key === 'Enter') saveShipQty(${r.id})">`
            : `${fmtQty(r.qty)}개`;
          html += `<div class="ship-row${checked.has(r.id) ? ' checked' : ''}" style="border-left-color:${fc};" onclick="toggleShipChecked(event, ${r.id}, this)">
            <div class="ship-loc">${shipLocHtml(r)}</div>
            <div class="ship-name">${r.name}</div>
            <div class="ship-qty">${qtyCell}</div>
            <div class="ship-btns">
              ${editing
                ? `<button class="ship-btn ship-edit save" onclick="saveShipQty(${r.id})">저장</button>`
                : `<button class="ship-btn ship-edit" onclick="startShipEdit(${r.id})">수정</button>`}
              <button class="ship-btn ship-del" onclick="cancelShipRow(${r.id})">취소</button>
            </div>
          </div>`;
        });
        html += '</div>';
      }
      document.getElementById('ship-content').innerHTML = html;
    }

    // ===== 출고표 행 체크 (물건 어디까지 찾았는지 표시) =====
    // localStorage에 출고표 항목 id 목록으로 저장 → 새로고침해도 유지
    const SHIP_CHECKED_KEY = 'shipCheckedIds';
    function loadShipChecked() {
      try { return new Set(JSON.parse(localStorage.getItem(SHIP_CHECKED_KEY) || '[]')); }
      catch (e) { return new Set(); }
    }
    function saveShipChecked(set) {
      try { localStorage.setItem(SHIP_CHECKED_KEY, JSON.stringify([...set])); } catch (e) {}
    }
    // 출고표에서 사라진 항목(취소/삭제/출고완료)의 체크 기록은 지운다
    function pruneShipChecked() {
      const ids = new Set(shippingSheet.map(r => r.id));
      const checked = loadShipChecked();
      const kept = new Set([...checked].filter(id => ids.has(id)));
      if (kept.size !== checked.size) saveShipChecked(kept);
    }
    function toggleShipChecked(event, id, rowEl) {
      if (event.target.closest('button, input')) return; // 버튼·입력칸 누를 땐 색 안 바꿈
      const checked = loadShipChecked();
      if (checked.has(id)) checked.delete(id); else checked.add(id);
      saveShipChecked(checked);
      rowEl.classList.toggle('checked', checked.has(id));
    }

    // ===== 출고표 수량 수정 =====
    let shipEditId = null;     // 지금 수량을 고치고 있는 출고표 항목 id
    let shipEditDraft = '';    // 입력 중인 값 (실시간 갱신으로 다시 그려져도 유지)
    let shipEditBusy = false;

    function startShipEdit(id) {
      const row = shippingSheet.find(r => r.id === id);
      if (!row) return;
      shipEditId = id;
      shipEditDraft = String(roundQty(row.qty));
      renderShippingSheet();
      const input = document.getElementById(`ship-qty-input-${id}`);
      if (input) { input.focus(); input.select(); }
    }

    // 저장: 출고표 수량을 바꾸고, 바뀐 차이만큼 재고도 맞춘다
    //  - 늘리면 그 위치 재고에서 더 차감('출고' 로그), 0이 되면 상품 삭제
    //  - 줄이면 그 위치 재고로 되돌림('출고취소' 로그)
    async function saveShipQty(id) {
      if (shipEditBusy) return;
      const row = shippingSheet.find(r => r.id === id);
      const input = document.getElementById(`ship-qty-input-${id}`);
      if (!row || !input) return;
      const newQty = parseQtyValue(input.value.trim().replace(',', '.'));
      if (newQty === null) { input.classList.add('invalid'); input.focus(); return; }

      const oldQty = roundQty(row.qty);
      const diff = roundQty(newQty - oldQty);
      if (diff === 0) { shipEditId = null; renderShippingSheet(); return; }

      shipEditBusy = true;
      try {
        let stockItem = null;
        if (diff > 0) {
          await loadInventory(); // 최신 재고 기준으로 부족 여부 판단
          const items = (inv[row.col] && inv[row.col][row.can] && inv[row.col][row.can][row.floor]) || [];
          stockItem = items.find(it => it.n === row.name);
          const have = stockItem ? stockItem.q : 0;
          if (have < diff) {
            return alert(`재고가 부족합니다.
${shipLocText(row)} "${row.name}" 남은 재고 ${fmtQty(have)}개 (추가로 ${fmtQty(diff)}개 필요)`);
          }
        }

        const { error: shipErr } = await sb.from('shipping_sheet').update({ qty: newQty }).eq('id', id);
        logSb('update', 'shipping_sheet', shipErr, { id, qty: newQty });
        if (shipErr) { console.error('[Supabase] 출고표 수량 수정 실패:', shipErr); return alert('출고표 수정 오류: ' + shipErr.message); }

        let result;
        if (diff > 0) {
          result = await applyOutflow(stockItem, diff, { col: row.col, can: row.can, floor: row.floor, id: stockItem.id });
        } else {
          result = await restoreStockFromShipRow({ ...row, qty: -diff });
        }

        shipEditId = null;
        shipEditDraft = '';
        await loadInventory();
        await loadLogs();
        await loadShippingSheet();
        render();
        renderLogs();
        renderShippingSheet();
        renderShipSearch();

        if (result.error) { console.error('[Supabase] 수량 수정 중 재고 반영 실패:', result.error); return alert('출고표 수량은 바뀌었지만 재고 반영에 실패했습니다: ' + result.error.message); }
        if (result.logErr) console.error('[Supabase] 수량 수정 로그 저장 실패:', result.logErr);
      } finally {
        shipEditBusy = false;
      }
    }

    // 출고표 한 건을 재고로 되돌린다.
    // - 같은 위치(열/칸/층)에 같은 상품명이 있으면 그 상품 수량에 더한다.
    // - 출고로 재고가 0이 돼서 상품이 삭제됐던 경우엔 그 위치에 새로 만든다 (입고일: 오늘).
    // - 되돌릴 때마다 inventory_logs에 '출고취소' 로그를 남긴다.
    async function restoreStockFromShipRow(row) {
      await loadInventory(); // 항상 최신 재고 상태를 기준으로 합칠지/새로 만들지 판단한다
      const { col, can, floor, name } = row;
      const qty = roundQty(row.qty);
      const destItems = (inv[col] && inv[col][can] && inv[col][can][floor]) || [];
      const existing = destItems.find(it => it.n === name);

      if (existing) {
        const newQty = roundQty(existing.q + qty);
        const { error } = await sb.from('inventory_items').update({ qty: newQty }).eq('id', existing.id);
        logSb('update', 'inventory_items', error, { id: existing.id, qty: newQty });
        if (error) return { error };
      } else {
        const insertPayload = { col, can, floor, name, qty, in_date: getTodayDate(), exp_date: null };
        const { error } = await sb.from('inventory_items').insert(insertPayload);
        logSb('insert', 'inventory_items', error, insertPayload);
        if (error) return { error };
      }

      const logPayload = { type: '출고취소', col, can, floor, name, qty, date: getTodayDate() };
      const { error: logErr } = await sb.from('inventory_logs').insert(logPayload);
      logSb('insert', 'inventory_logs', logErr, logPayload);
      if (logErr) console.error('[Supabase] 출고취소 로그 저장 실패:', logErr);

      return { error: null };
    }

    // 출고표 행 하나를 취소(= 재고 원복) 하고 그 행을 출고표에서 지운다.
    async function cancelShipRow(id) {
      const row = shippingSheet.find(r => r.id === id);
      if (!row) return;
      const loc = shipLocText(row);
      if (!confirm(`재고 ${fmtQty(row.qty)}개가 원래 위치(${loc})로 복구됩니다. 취소할까요?`)) return;

      const { error } = await restoreStockFromShipRow(row);
      if (error) { console.error('[Supabase] 출고 취소(재고 복구) 실패:', error); return alert('재고 복구 오류: ' + error.message); }

      const { error: delErr } = await sb.from('shipping_sheet').delete().eq('id', id);
      logSb('delete', 'shipping_sheet', delErr, { id });

      await loadInventory();
      await loadLogs();
      await loadShippingSheet();
      render();
      renderLogs();
      renderShippingSheet();

      if (delErr) { console.error('[Supabase] 출고표 행 삭제 실패:', delErr); return alert('재고는 복구됐지만 출고표 행 삭제에 실패했습니다: ' + delErr.message); }
      alert('출고가 취소되어 재고가 복구되었습니다!');
    }

    // "출고 완료": 재고는 그대로 두고 출고표 기록만 전부 삭제 (실제로 물건이 나간 뒤 정리용)
    async function completeShipping() {
      if (shippingSheet.length === 0) return alert('출고표가 비어 있습니다');
      if (!confirm(`출고표 ${shippingSheet.length}건을 출고 완료 처리할까요?\n(재고는 그대로 두고 출고표 기록만 삭제됩니다)`)) return;
      const { error } = await sb.from('shipping_sheet').delete().gte('id', 0);
      logSb('delete', 'shipping_sheet', error, '전체(출고완료)');
      if (error) return alert('삭제 오류: ' + error.message);
      await loadShippingSheet();
      renderShippingSheet();
      alert('출고 완료 처리되었습니다!');
    }

    // "전체 취소": 출고표 모든 행을 재고로 되돌린 뒤(행마다 '출고취소' 로그 기록) 출고표를 비운다
    async function cancelAllShipping() {
      if (shippingSheet.length === 0) return alert('출고표가 비어 있습니다');
      const rows = sortShippingRows(shippingSheet);
      const total = rows.reduce((sum, r) => roundQty(sum + Number(r.qty)), 0);
      if (!confirm(`출고표 ${rows.length}건(합계 ${fmtQtyComma(total)}개)을 전체 취소할까요?\n각 상품이 원래 위치로 복구되고, 출고표 기록은 모두 삭제됩니다.`)) return;

      let failCount = 0;
      for (const row of rows) {
        const { error } = await restoreStockFromShipRow(row);
        if (error) { failCount++; console.error('[Supabase] 전체 취소 중 재고 복구 실패:', row, error); continue; }
        const { error: delErr } = await sb.from('shipping_sheet').delete().eq('id', row.id);
        if (delErr) { failCount++; console.error('[Supabase] 전체 취소 중 출고표 행 삭제 실패:', row, delErr); }
      }

      await loadInventory();
      await loadLogs();
      await loadShippingSheet();
      render();
      renderLogs();
      renderShippingSheet();

      if (failCount > 0) alert(`일부 항목(${failCount}건) 처리에 실패했습니다. 콘솔(F12)에서 확인해주세요.`);
      else alert('전체 취소되었습니다! 재고가 모두 복구되었습니다.');
    }

    function downloadShippingExcel() {
      // 화면에 보이는 정렬 순서(열 → 칸 → 층) 그대로 내보낸다
      const rows = [['위치', '상품명', '수량', '날짜']];
      sortShippingRows(shippingSheet).forEach(r => {
        rows.push([shipLocText(r), r.name, roundQty(r.qty), r.date || '']);
      });
      const ws = XLSX.utils.aoa_to_sheet(rows);
      applyQtyFormat(ws, 'C', rows.length);
      ws['!cols'] = [{ wch: 16 }, { wch: 24 }, { wch: 10 }, { wch: 14 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '출고표');
      XLSX.writeFile(wb, `출고표_${getTodayDate()}.xlsx`);
    }

    function doSearch() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const { prod } = getProductTotals();
      let html = '';
      ['A','B','C'].forEach(col => {
        for (let c = 1; c <= 20; c++) {
          if (inv[col][c]) {
            for (let f = 1; f <= 10; f++) {
              if (inv[col][c][f]) {
                inv[col][c][f].forEach((it, idx) => {
                  if (it.n.toLowerCase().includes(q)) {
                    const totalQty = prod[it.n] ? prod[it.n].qty : it.q;
                    const qtyColor = getStockStatus(totalQty).color;
                    html += `<div class="search-result-item" onclick="openEditModal('${col}',${c},${f},${idx})">
                      <span class="log-item-name">${it.n}</span>${it.d ? ` <span class="fl-date">[${it.d}]</span>` : ''}<br>
                      <span class="log-loc-col">${col}</span>열 <span class="log-loc-can">${c}</span>칸 <span class="log-loc-floor">${f}</span>층 | <span style="color:${qtyColor}; font-weight:bold;">${fmtQty(it.q)}개</span>
                    </div>`;
                  }
                });
              }
            }
          }
        }
      });
      document.getElementById('search-results').innerHTML = html || '<div style="color:#999; font-size: 16px;">없음</div>';
    }

    async function resetData() {
      if (!confirm('초기화? (모든 데이터가 지워지고 초기 데이터로 교체됩니다)')) return;

      const { error: delItemsErr } = await sb.from('inventory_items').delete().gte('id', 0);
      if (delItemsErr) return alert('초기화 오류: ' + delItemsErr.message);
      const { error: delLogsErr } = await sb.from('inventory_logs').delete().gte('id', 0);
      if (delLogsErr) return alert('초기화 오류: ' + delLogsErr.message);

      const rows = flattenInitialData();
      if (rows.length) {
        const { error: insErr } = await sb.from('inventory_items').insert(rows);
        if (insErr) return alert('초기화 오류: ' + insErr.message);
      }

      await loadInventory();
      await loadLogs();
      render();
      alert('완료!');
    }

    async function seedInitialData() {
      const { count, error: countErr } = await sb.from('inventory_items').select('*', { count: 'exact', head: true });
      if (countErr) return alert('확인 오류: ' + countErr.message);

      if (count > 0) {
        if (!confirm(`이미 ${count}개의 데이터가 등록되어 있습니다. 그래도 초기 데이터를 추가하시겠습니까? (중복 등록됩니다)`)) return;
      } else {
        if (!confirm('초기 데이터를 Supabase에 등록하시겠습니까?')) return;
      }

      const rows = flattenInitialData();
      const { error } = await sb.from('inventory_items').insert(rows);
      if (error) return alert('등록 오류: ' + error.message);

      alert('초기 데이터가 등록되었습니다!');
      await loadInventory();
      render();
    }

    function downloadCSV() {
      let csv = '열,칸,층,상품명,수량,입고날짜,유통기한\n';
      ['A','B','C'].forEach(col => {
        for (let c = 1; c <= 20; c++) {
          if (inv[col][c]) {
            for (let f = 1; f <= 10; f++) {
              if (inv[col][c][f]) inv[col][c][f].forEach(it => csv += `${col},${c},${f},${it.n},${fmtQty(it.q)},${it.d},${it.e || ''}\n`);
            }
          }
        }
      });
      const blob = new Blob([csv], {type: 'text/csv'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '재고.csv';
      a.click();
    }

    function downloadInventoryExcel() {
      const rows = [['열', '칸', '층', '상품명', '수량', '입고일', '유통기한']];
      ['A', 'B', 'C'].forEach(col => {
        for (let c = 1; c <= 20; c++) {
          if (inv[col][c]) {
            for (let f = 1; f <= 10; f++) {
              if (inv[col][c][f]) inv[col][c][f].forEach(it => rows.push([col, c, f, it.n, roundQty(it.q), it.d || '', it.e || '']));
            }
          }
        }
      });
      const ws = XLSX.utils.aoa_to_sheet(rows);
      applyQtyFormat(ws, 'E', rows.length);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '재고현황');
      XLSX.writeFile(wb, `재고현황_${getTodayDate()}.xlsx`);
    }

    function downloadLogsExcel() {
      const rows = [['구분', '열', '칸', '층', '상품명', '수량', '날짜']];
      logs.forEach(l => rows.push([l.type, l.col, l.can, l.floor, l.name, roundQty(l.qty), l.date]));
      const ws = XLSX.utils.aoa_to_sheet(rows);
      applyQtyFormat(ws, 'F', rows.length);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '입출고로그');
      XLSX.writeFile(wb, `입출고로그_${getTodayDate()}.xlsx`);
    }

    function downloadMonthlyStatsExcel() {
      const month = getSelectedMonth();
      const prod = getMonthlyProductStats(month);
      const rows = [['월', '상품명', '입고', '출고']];
      Object.entries(prod).forEach(([name, v]) => rows.push([month, name, roundQty(v.in), roundQty(v.out)]));
      const ws = XLSX.utils.aoa_to_sheet(rows);
      applyQtyFormat(ws, 'C', rows.length);
      applyQtyFormat(ws, 'D', rows.length);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '월별통계');
      XLSX.writeFile(wb, `월별통계_${month}.xlsx`);
    }

    function downloadJSON() {
      const blob = new Blob([JSON.stringify({inv, logs},null,2)], {type: 'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '재고.json';
      a.click();
    }

    function uploadJSON() { document.getElementById('file-input').click(); }

    function loadJSON(e) {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = async (ev) => {
        try {
          const d = JSON.parse(ev.target.result);
          if (!confirm('현재 Supabase 데이터를 모두 지우고 이 파일로 복원하시겠습니까?')) return;

          const { error: delItemsErr } = await sb.from('inventory_items').delete().gte('id', 0);
          if (delItemsErr) throw new Error(delItemsErr.message);
          const { error: delLogsErr } = await sb.from('inventory_logs').delete().gte('id', 0);
          if (delLogsErr) throw new Error(delLogsErr.message);

          const itemRows = [];
          Object.entries(d.inv || {}).forEach(([col, cans]) => {
            Object.entries(cans).forEach(([can, floors]) => {
              Object.entries(floors).forEach(([floor, items]) => {
                items.forEach(it => itemRows.push({ col, can: parseInt(can), floor: parseInt(floor), name: it.n, qty: roundQty(it.q), in_date: it.d, exp_date: it.e || null }));
              });
            });
          });
          if (itemRows.length) {
            const { error } = await sb.from('inventory_items').insert(itemRows);
            if (error) throw new Error(error.message);
          }

          const logRows = (d.logs || []).map(l => ({ type: l.type, col: l.col, can: l.can, floor: l.floor, name: l.name, qty: roundQty(l.qty), date: l.date }));
          if (logRows.length) {
            const { error } = await sb.from('inventory_logs').insert(logRows);
            if (error) throw new Error(error.message);
          }

          await loadInventory();
          await loadLogs();
          render();
          alert('복원!');
        } catch(err) { alert('오류: ' + err.message); }
      };
      r.readAsText(f);
    }

    (async function init() {
      await loadInventory();
      await loadLogs();
      await loadShippingSheet();
      render();
      renderShippingSheet();
      subscribeRealtime();
    })();
  </script>
</body>
