<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>재고관리</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root { --surface-1: #f1f3f5; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial; background: #f5f5f5; padding: 20px; }
    .container { max-width: 100%; }
    h1 { margin-bottom: 20px; font-size: 32px; }

    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .tab-btn { padding: 12px 24px; background: none; border: none; cursor: pointer; border-bottom: 3px solid transparent; font-size: 16px; white-space: nowrap; color: #000; }
    .tab-btn.active { border-bottom-color: #0066cc; color: #0066cc; font-weight: bold; }
    .panel { display: none; }
    .panel.active { display: block; }

    .cols-container { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; align-items: start; }
    .col-wrapper { background: white; border-radius: 8px; padding: 0; border: 2px solid #ddd; overflow: hidden; }
    .col-header { padding: 15px; background: #000; color: #fff; font-size: 22px; font-weight: bold; text-align: center; }
    .cans-list { display: flex; flex-direction: column; gap: 18px; padding: 20px; }

    .can-island { display: flex; align-items: center; gap: 12px; }
    .can-num { font-size: 22px; font-weight: bold; color: #000; min-width: 50px; text-align: center; }
    .can-box { flex: 1; min-width: 0; background: #fff; border: 2px solid #bbb; border-radius: 12px; padding: 6px 12px; }

    .floor-line { display: flex; align-items: center; padding: 13px 4px; border-bottom: 1px solid #ddd; cursor: pointer; transition: all 0.15s; border-radius: 4px; }
    .floor-line:last-child { border-bottom: none; }
    .floor-line:hover { background: #f0f0f0; }
    .fl-floor { min-width: 48px; font-weight: bold; color: #0066cc; font-size: 17px; }
    .fl-name-col { flex: 1; text-align: center; }
    .fl-name { font-weight: 600; color: #222; font-size: 17px; word-break: break-all; }
    .fl-date { font-weight: 400; color: #888; font-size: 14px; }
    .fl-exp { font-weight: 400; color: #fd7e14; font-size: 12px; margin-top: 2px; }
    .fl-qty { min-width: 74px; text-align: right; font-weight: bold; color: #e03131; font-size: 17px; }
    .fl-empty { color: #888; font-weight: 400; }

    .card { background: white; padding: 20px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 20px; }
    .stat-select { padding: 10px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 15px; background: white; }
    .sort-dir-btn { padding: 10px 14px; min-width: 88px; border: 1px solid #ddd; border-radius: 4px; font-size: 15px; background: white; color: #0066cc; font-weight: bold; cursor: pointer; margin: 0; }
    .sort-dir-btn:hover, .sort-dir-btn:active { background: #f0f6ff; }
    .loc-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .loc-chip { display: inline-flex; align-items: center; padding: 8px 14px; border: 1px solid #ddd; border-radius: 6px; background: #f2f2f2; font-weight: 500; font-size: 15px; cursor: pointer; transition: background 0.15s; -webkit-tap-highlight-color: transparent; }
    .loc-chip:hover, .loc-chip:active { background: #e5e5e5; }
    .loc-chip .loc-col { color: #185FA5; }
    .loc-chip .loc-can { color: #3B6D11; }
    .loc-chip .loc-floor { color: #854F0B; }
    .loc-chip .loc-dash { color: #999; margin: 0 1px; }

    .stats-summary-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 16px; background: var(--surface-1); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; color: #333; }
    .stats-summary-count { font-weight: bold; }
    .stats-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: #555; }
    .legend-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

    .stock-card { display: flex; background: white; border: 0.5px solid #ccc; border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
    .stock-card-bar { width: 5px; flex-shrink: 0; }
    .stock-card-body { flex: 1; min-width: 0; padding: 14px 16px; }
    .stock-card-header { display: flex; justify-content: flex-start; align-items: baseline; gap: 8px; }
    .stock-card-name { font-size: 19px; font-weight: bold; color: #222; word-break: break-all; }
    .stock-card-qty { font-size: 19px; font-weight: bold; white-space: nowrap; }
    input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; }
    button { padding: 12px 20px; margin: 10px 10px 10px 0; background: #0066cc; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
    button:hover { background: #0052a3; }
    button.in { background: #28a745; }
    button.in:hover { background: #218838; }
    button.out { background: #ffc107; color: #000; }
    button.out:hover { background: #e0a800; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
    .modal.active { display: flex; align-items: center; justify-content: center; }
    .modal-content { background: white; padding: 30px; border-radius: 8px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-size: 22px; font-weight: bold; margin-bottom: 20px; }
    .modal input, .modal select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; }
    .modal-label { font-size: 16px; font-weight: bold; margin-bottom: 8px; display: block; margin-top: 15px; }
    .modal-buttons { display: flex; gap: 10px; margin-top: 12px; }
    .modal-buttons button { flex: 1; margin: 0; }
    .modal-buttons.quad { gap: 6px; }
    .modal-buttons.quad button { flex: 1 1 0; min-width: 0; padding: 13px 2px; font-size: 14px; white-space: nowrap; }
    .divider { border-top: 2px solid #ddd; margin: 20px 0; }
    .log-entry { background: #f9f9f9; padding: 12px; margin: 10px 0; border-left: 4px solid #0066cc; border-radius: 4px; }
    .log-first-line { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 4px; }
    .log-date { color: #666; font-size: 13px; }
    .log-del { background: #dc3545; padding: 6px 12px; margin: 0; flex: none; font-size: 13px; border-radius: 4px; -webkit-tap-highlight-color: transparent; }
    .log-del:hover { background: #c82333; }

    .log-filter-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
    .log-type-toggle { display: flex; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; }
    .log-type-btn { margin: 0; padding: 10px 16px; background: white; color: #333; border: none; border-radius: 0; font-size: 14px; cursor: pointer; }
    .log-type-btn + .log-type-btn { border-left: 1px solid #ddd; }
    .log-type-btn.active { background: #0066cc; color: white; font-weight: bold; }
    .log-range { display: flex; align-items: center; gap: 6px; }
    .log-date-input { width: auto; margin: 0; padding: 9px 10px; font-size: 14px; }
    .log-range-sep { color: #999; }
    .log-loc-col { color: #185FA5; font-weight: 500; }
    .log-loc-can { color: #3B6D11; font-weight: 500; }
    .log-loc-floor { color: #854F0B; font-weight: 500; }
    .log-item-name { font-weight: bold; color: #000; }
    .log-qty { color: #C2410C; font-weight: bold; }

    /* ===== 출고표 ===== */
    .ship-toolbar { display: flex; flex-wrap: nowrap; gap: 5px; align-items: center; margin-bottom: 14px; }
    .ship-toolbar button { flex: 1; min-width: 0; margin: 0; padding: 10px 0; font-size: 13px; white-space: nowrap; }
    /* 출고표 목록: 표(그리드) 형태 - 위치 76px / 제품명 70px / 수량 58px / 버튼(남는 공간) */
    .ship-list { border-top: 1px solid #d9d9d9; }
    .ship-row { display: grid; grid-template-columns: 76px 70px 58px minmax(0, 1fr); background: #fff; border-bottom: 1px solid #d9d9d9; border-left: 4px solid #0066cc; border-right: 1px solid #d9d9d9; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
    .ship-row.checked { background: #ffe066; }
    .ship-row > div { min-width: 0; padding: 8px 5px; display: flex; align-items: center; border-right: 1px solid #d9d9d9; }
    .ship-row > div:last-child { border-right: none; }
    .ship-loc { font-weight: bold; font-size: 14px; line-height: 1.3; word-break: keep-all; }
    .ship-name { font-weight: bold; color: #000; font-size: 14px; line-height: 1.3; word-break: keep-all; overflow-wrap: normal; }
    .ship-row > .ship-qty { justify-content: center; text-align: center; color: #C2410C; font-weight: bold; font-size: 14px; word-break: keep-all; }
    .ship-qty-input { width: 100%; height: 30px; margin: 0; padding: 0 2px; font-size: 14px; text-align: center; border: 1px solid #999; border-radius: 4px; -moz-appearance: textfield; }
    .ship-qty-input::-webkit-outer-spin-button, .ship-qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .ship-qty-input.invalid { border: 2px solid #dc3545; }
    .ship-row > .ship-btns { gap: 5px; overflow: hidden; }
    .ship-row .ship-btn { flex: 1 1 0; min-width: 0; max-width: 56px; height: 34px; margin: 0; padding: 0; font-size: 13px; border-radius: 6px; color: #fff; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
    .ship-row .ship-edit { background: #f08a24; }
    .ship-row .ship-edit:hover { background: #d97817; }
    .ship-row .ship-edit.save { background: #1f9a5a; }
    .ship-row .ship-edit.save:hover { background: #1a8450; }
    .ship-row .ship-del { background: #6b7280; }
    .ship-row .ship-del:hover { background: #5b616d; }
    .ship-search-input { margin: 0 0 10px; padding: 14px; font-size: 17px; min-height: 50px; }
    .ship-search-results { margin-bottom: 16px; }
    .ship-sr { border: 1px solid #ddd; border-left: 4px solid #0066cc; border-radius: 6px; background: #fff; margin-bottom: 8px; overflow: hidden; }
    .ship-sr.open { border-color: #0066cc; }
    .ship-sr-line { display: flex; align-items: center; gap: 10px; padding: 14px; min-height: 52px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .ship-sr-line:hover, .ship-sr-line:active { background: #f0f6ff; }
    .ship-sr-stock { color: #0066cc; font-weight: bold; font-size: 16px; white-space: nowrap; }
    .ship-sr-form { display: flex; gap: 8px; padding: 0 14px 14px; }
    .ship-sr-form input { flex: 1; min-width: 0; margin: 0; padding: 12px; font-size: 17px; min-height: 50px; }
    .ship-sr-form button { margin: 0; flex: none; min-height: 50px; padding: 12px 16px; background: #0d9488; font-weight: bold; white-space: nowrap; }
    .ship-sr-form button:hover { background: #0b7d73; }
    .ship-sr-empty { color: #999; text-align: center; padding: 16px; font-size: 16px; }

    /* 사장님 출고 사진 → 출고표 자동 입력 */
    .ship-photo-drop { border: 2px dashed #9bbbe0; border-radius: 10px; background: #f5f9ff; padding: 14px; margin-bottom: 16px; text-align: center; transition: background 0.15s, border-color 0.15s; }
    .ship-photo-drop.dragover { background: #e3efff; border-color: #0066cc; }
    .ship-photo-btn { margin: 0; width: 100%; min-height: 54px; font-size: 17px; font-weight: bold; background: #6f42c1; }
    .ship-photo-btn:hover { background: #5a32a3; }
    .ship-photo-hint { color: #666; font-size: 13px; margin-top: 8px; }
    .ship-photo-status { font-size: 15px; margin-top: 8px; }
    .ship-photo-status:empty { display: none; }
    .ship-photo-status.err { color: #b02a37; }
    .pr-card { border: 2px solid #6f42c1; border-radius: 10px; background: #fff; padding: 14px; margin-bottom: 16px; }
    .pr-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; }
    /* 확인 화면 표: 모든 글씨 13px */
    .pt-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 10px; }
    .pt-table { width: 100%; min-width: 580px; border-collapse: collapse; font-size: 13px; }
    .pt-table th, .pt-table td { border: 1px solid #ccc; padding: 6px 8px; font-size: 13px; vertical-align: middle; text-align: left; }
    .pt-table th { background: #f1f3f5; font-weight: bold; white-space: nowrap; }
    .pt-table tfoot td { background: #f8f9fa; font-weight: bold; }
    .pt-table tr.red td { background: #fff5f5; }
    .pt-table tr.yellow td { background: #fffbea; }
    .pt-table tr.pt-sub td { border-top-style: dashed; }
    .pt-num { text-align: right !important; white-space: nowrap; }
    .pt-muted { color: #777; }
    .pt-name { max-width: 220px; }
    .pt-ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 입력칸·선택칸: 기본 모양 없애고 칸에 꽉 차게 (높이 = 다른 칸과 같은 31px) */
    .pt-table td { height: 31px; line-height: 18px; }
    .pt-table td.pt-fill { padding: 0; position: relative; }
    .pt-qty { display: block; width: 100%; min-width: 76px; height: 31px; margin: 0; padding: 0 8px; border: none; border-radius: 0; box-shadow: none; background: transparent; font-size: 13px; line-height: 31px; text-align: right; -webkit-appearance: none; appearance: none; }
    .pt-qty:focus, .pt-select:focus { outline: 2px solid #0066cc; outline-offset: -2px; }
    .pt-select-wrap { position: relative; display: block; background: #fff8d6; }
    .pt-select { display: block; width: 100%; min-width: 130px; height: 31px; margin: 0; padding: 0 26px 0 8px; border: none; border-radius: 0; box-shadow: none; background: transparent; color: #000; font-size: 13px; line-height: 31px; cursor: pointer; -webkit-appearance: none; -moz-appearance: none; appearance: none; }
    .pt-select::-ms-expand { display: none; }
    .pt-arrow { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; font-size: 15px; line-height: 1; color: #664d03; font-weight: bold; margin-top: -3px; }
    .pt-unmatched { color: #dc3545; font-weight: bold; }
    .pt-badge { display: inline-block; font-size: 13px; font-weight: bold; border-radius: 4px; padding: 2px 8px; white-space: nowrap; }
    .pt-badge.green { background: #d1f0dc; color: #146c43; }
    .pt-badge.yellow { background: #ffe69c; color: #664d03; }
    .pt-badge.red { background: #dc3545; color: #fff; }
    .pt-remember { display: flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 11px; color: #555; cursor: pointer; white-space: nowrap; }
    .pt-remember input { width: 14px; height: 14px; margin: 0; flex: none; }
    .pr-footer { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 6px; }
    .pr-footer button { margin: 0; min-height: 48px; font-size: 15px; font-weight: bold; }
    .pr-footer .pr-add { flex: 2 1 200px; background: #0d9488; }
    .pr-footer .pr-add:disabled { background: #9ccfca; cursor: not-allowed; }
    .pr-footer .pr-cancel { flex: 1 1 100px; background: #999; }
    .pr-block-msg { width: 100%; color: #b02a37; font-weight: bold; font-size: 13px; }
    .pr-block-msg:empty { display: none; }

    .search-result-item { background: white; padding: 16px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 10px; font-size: 16px; line-height: 1.5; cursor: pointer; transition: background 0.15s; -webkit-tap-highlight-color: transparent; }
    .search-result-item:hover, .search-result-item:active { background: #f0f6ff; }

    /* ===== 모바일 최적화 ===== */
    @media (max-width: 768px) {
      body { padding: 12px; }
      h1 { font-size: 24px; margin-bottom: 14px; }
      .tabs { gap: 4px; margin-bottom: 14px; }
      .tab-btn { padding: 10px 14px; font-size: 14px; }
      .cols-container { grid-template-columns: 1fr; gap: 16px; }
      .col-header { font-size: 20px; padding: 13px; }
      .cans-list { gap: 14px; padding: 14px; }
      .can-num { font-size: 20px; min-width: 42px; }
      .can-box { padding: 4px 10px; }
      .floor-line { padding: 14px 4px; }
      .fl-floor { min-width: 42px; font-size: 16px; }
      .fl-name { font-size: 16px; }
      .fl-date { font-size: 13px; }
      .fl-qty { min-width: 68px; font-size: 16px; }
      .modal-content { padding: 20px; width: 94%; max-height: 92vh; }
      .modal-title { font-size: 20px; }
      button { padding: 14px 18px; }
      .modal-buttons button { padding: 14px 10px; font-size: 15px; }
      .log-del { padding: 8px 14px; font-size: 14px; }
      .log-filter-bar { gap: 8px; }
      .log-type-btn { padding: 10px 12px; font-size: 13px; }
      .log-range { width: 100%; }
      .log-date-input { flex: 1; min-width: 0; }
      .modal-buttons.quad { gap: 4px; }
      .modal-buttons.quad button { padding: 13px 1px; font-size: 13px; }
      .ship-sr-line { flex-wrap: wrap; gap: 4px 10px; }
    }
    @media (max-width: 400px) {
      .can-island { gap: 8px; }
      .can-num { font-size: 18px; min-width: 36px; }
      .fl-floor { min-width: 38px; font-size: 15px; }
      .fl-name { font-size: 15px; }
      .fl-qty { min-width: 62px; font-size: 15px; }
      .modal-buttons.quad button { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📦 재고관리</h1>

    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('search', this)">🔍 검색</button>
      <button class="tab-btn" onclick="showTab('stats', this)">📈 통계</button>
      <button class="tab-btn" onclick="showTab('logs', this)">📋 로그</button>
      <button class="tab-btn" onclick="showTab('ship', this)">📄 출고표</button>
      <button class="tab-btn" onclick="showTab('export', this)">💾 백업</button>
    </div>

    <div id="search" class="panel active">
      <div class="card">
        <h2>상품 검색</h2>
        <input type="text" id="search-input" placeholder="상품명..." onkeyup="doSearch()">
        <div id="search-results"></div>
      </div>
    </div>

    <div id="stats" class="panel">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:10px;">
          <h2 style="margin:0;">📦 재고 통계</h2>
          <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
            <select id="stats-sort" class="stat-select" onchange="renderStats()">
              <option value="qty">수량순</option>
              <option value="name">이름순(가나다)</option>
            </select>
            <button id="stats-sort-dir" class="sort-dir-btn" onclick="toggleStatsSortDir()">↓ 내림</button>
            <button onclick="downloadInventoryExcel()" style="margin:0;">📊 재고현황 엑셀</button>
          </div>
        </div>
        <div id="stats-content"></div>
      </div>

      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:10px;">
          <h2 style="margin:0;">📅 월별 입출고 통계</h2>
          <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
            <select id="month-select" class="stat-select" onchange="renderMonthlyStats()"></select>
            <select id="monthly-sort" class="stat-select" onchange="renderMonthlyStats()">
              <option value="qty">수량순</option>
              <option value="name">이름순(가나다)</option>
            </select>
            <button id="monthly-sort-dir" class="sort-dir-btn" onclick="toggleMonthlySortDir()">↓ 내림</button>
            <button onclick="downloadMonthlyStatsExcel()" style="margin:0;">📊 월별통계 엑셀</button>
          </div>
        </div>
        <div id="monthly-stats-content"></div>
      </div>
    </div>

    <div id="logs" class="panel">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:10px;">
          <h2 style="margin:0;">입/출고 로그</h2>
          <button onclick="downloadLogsExcel()" style="margin:0;">📊 입출고로그 엑셀</button>
        </div>

        <div class="log-filter-bar">
          <div class="log-type-toggle">
            <button class="log-type-btn active" onclick="setLogTypeFilter('all', this)">전체</button>
            <button class="log-type-btn" onclick="setLogTypeFilter('입고', this)">입고</button>
            <button class="log-type-btn" onclick="setLogTypeFilter('출고', this)">출고</button>
          </div>
          <button id="log-sort-dir" class="sort-dir-btn" onclick="toggleLogSortDir()">↓ 최신순</button>
          <div class="log-range">
            <input type="date" id="log-date-from" class="log-date-input" onchange="renderLogs()">
            <span class="log-range-sep">~</span>
            <input type="date" id="log-date-to" class="log-date-input" onchange="renderLogs()">
          </div>
        </div>

        <div id="logs-content"></div>
      </div>
    </div>

    <div id="ship" class="panel">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:10px;">

  <script>
    const COL_MAX = { A: 6, B: 6, C: 20 };

    // Supabase 초기화
    const SUPABASE_URL = 'https://ibdklbgmkiymqqscpoeu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImliZGtsYmdta2l5bXFxc2Nwb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMzU3MTEsImV4cCI6MjA5NzkxMTcxMX0.oQxJj_wsUAYaEIs4G0xzPszBiv8mplU-vea_Nnq9r1Q';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 디버깅용: Supabase 호출 결과를 콘솔에 출력 (F12 > Console 탭에서 확인)
    function logSb(op, table, error, payload) {
      if (error) {
        console.error(`[Supabase] ${table} ${op} 실패`, error, payload !== undefined ? { payload } : '');
      } else {
        console.log(`[Supabase] ${table} ${op} 성공`, payload !== undefined ? payload : '');
      }
    }

    // 초기 데이터 (seedInitialData / resetData 에서만 사용)
    const initialData = {
      A: {1:{2:[{n:'매직1제',q:24,d:'2024-01-01'},{n:'산화제',q:36,d:'2024-01-02'}]},2:{1:[{n:'산화제',q:8,d:'2024-01-03'}],2:[{n:'7/33',q:5,d:'2024-01-04'}],3:[{n:'5/30',q:22,d:'2024-01-05'}]},3:{2:[{n:'8/33',q:18,d:'2024-01-06'}],3:[{n:'매직1제',q:24,d:'2024-01-07'}]},4:{3:[{n:'10/45',q:12,d:'2024-01-08'}]},5:{1:[{n:'8/30',q:17,d:'2024-01-09'}],2:[{n:'3/0',q:20,d:'2024-01-10'}],3:[{n:'산화제',q:36,d:'2024-01-11'}]},6:{3:[{n:'산화제',q:54,d:'2024-01-12'}]}},
      B: {1:{2:[{n:'5/45',q:19,d:'2024-01-13'}]},2:{1:[{n:'매직1제',q:6,d:'2024-01-14'}],2:[{n:'8/1',q:3,d:'2024-01-15'}],3:[{n:'9/30',q:16,d:'2024-01-16'}]},3:{1:[{n:'6/30',q:16,d:'2024-01-17'}],2:[{n:'6/33',q:19,d:'2024-01-18'}],3:[{n:'02/02',q:18,d:'2024-01-19'}]},4:{1:[{n:'6/33',q:7,d:'2024-01-20'}],2:[{n:'10/30',q:7,d:'2024-01-21'}]},5:{1:[{n:'1/0',q:22,d:'2024-01-22'}],2:[{n:'3/0',q:14,d:'2024-01-23'}],3:[{n:'산화제',q:36,d:'2024-01-24'}]},6:{3:[{n:'7/30',q:11,d:'2024-01-25'}]}},
      C: {1:{2:[{n:'크림',q:7,d:'2024-01-26'}]},2:{2:[{n:'크림',q:24,d:'2024-01-27'}]},4:{1:[{n:'8/34',q:4,d:'2024-01-28'}],2:[{n:'산화제',q:72,d:'2024-01-29'}]},5:{1:[{n:'산화제',q:36,d:'2024-01-30'}],2:[{n:'산화제',q:36,d:'2024-01-31'}]},6:{1:[{n:'6/30',q:5,d:'2024-02-01'}]}}
    };

    // ===== 수량(소수점 두 자리) 유틸 =====
    // 부동소수점 오차(0.1 + 0.2 = 0.30000000000000004) 방지를 위해
    // 모든 계산 결과는 roundQty로 소수 둘째 자리까지 반올림한다.
    function roundQty(n) {
      const v = Number(n);
      if (!isFinite(v)) return 0;
      return Math.round((v + Number.EPSILON) * 100) / 100;
    }
    // 화면 표시용: 항상 소수점 두 자리 (24 -> "24.00", 3.5 -> "3.50")
    function fmtQty(n) {
      return roundQty(n).toFixed(2);
    }
    // 천 단위 구분 + 소수점 두 자리 (통계 합계용)
    function fmtQtyComma(n) {
      return roundQty(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    // 입력칸 값 읽기: 비었거나 0 이하면 null
    function readQtyInput(id) {
      return parseQtyValue(document.getElementById(id).value);
    }
    function parseQtyValue(raw) {
      if (raw === '' || raw === null || raw === undefined) return null;
      const v = roundQty(parseFloat(raw));
      if (!isFinite(v) || v <= 0) return null;
      return v;
    }
    // 엑셀 수량 열에 소수점 두 자리 서식 적용
    function applyQtyFormat(ws, colLetter, rowCount) {
      for (let r = 2; r <= rowCount; r++) {
        const cell = ws[colLetter + r];
        if (cell && typeof cell.v === 'number') cell.z = '0.00';
      }
    }

    let inv = { A: {}, B: {}, C: {} };
    let logs = [];
    let shippingSheet = [];
    let shippingSheetError = null;
    let editingItem = null;
    let editingCan = null;
    let statsSortDir = 'desc';
    let monthlySortDir = 'desc';
    let logTypeFilter = 'all';
    let logSortDir = 'desc';

    function toggleStatsSortDir() {
      statsSortDir = statsSortDir === 'desc' ? 'asc' : 'desc';
      renderStats();
    }

    function toggleMonthlySortDir() {
      monthlySortDir = monthlySortDir === 'desc' ? 'asc' : 'desc';
      renderMonthlyStats();
    }

    function flattenInitialData() {
      const rows = [];
      Object.entries(initialData).forEach(([col, cans]) => {
        Object.entries(cans).forEach(([can, floors]) => {
          Object.entries(floors).forEach(([floor, items]) => {
            items.forEach(it => rows.push({ col, can: parseInt(can), floor: parseInt(floor), name: it.n, qty: it.q, in_date: it.d }));
          });
        });
      });
      return rows;
    }

    let invReqSeq = 0;
    async function loadInventory() {
      const seq = ++invReqSeq;
      console.log('[Supabase] inventory_items select 요청 중...');
      const { data: rows, error } = await sb.from('inventory_items').select('*');
      logSb('select', 'inventory_items', error, rows);
      if (error) { alert('재고 불러오기 오류: ' + error.message); return; }
      if (seq !== invReqSeq) return; // 이후에 시작된 더 최신 요청이 있으면 이 응답(구버전)은 버림
      const next = { A: {}, B: {}, C: {} };
      rows.forEach(row => {
        const { id, col, can, floor, name, qty, in_date, exp_date } = row;
        if (!next[col]) next[col] = {};
        if (!next[col][can]) next[col][can] = {};
        if (!next[col][can][floor]) next[col][can][floor] = [];
        next[col][can][floor].push({ id, n: name, q: roundQty(qty), d: in_date, e: exp_date });
      });
      inv = next;
    }

    async function loadLogs() {
      console.log('[Supabase] inventory_logs select 요청 중...');
      const { data: rows, error } = await sb.from('inventory_logs').select('*').order('id', { ascending: true });
      logSb('select', 'inventory_logs', error, rows);
      if (error) { alert('로그 불러오기 오류: ' + error.message); return; }
      logs = rows.map(r => ({ id: r.id, type: r.type, col: r.col, can: r.can, floor: r.floor, name: r.name, qty: roundQty(r.qty), date: r.date, fromCol: r.from_col, fromCan: r.from_can, fromFloor: r.from_floor }));
    }

    // 출고표 정렬: 열(A->B->C) -> 칸 번호(숫자순) -> 층(1->2->3) -> 등록순
    function sortShippingRows(rows) {
      return rows.slice().sort((a, b) =>
        String(a.col).localeCompare(String(b.col)) ||
        (Number(a.can) - Number(b.can)) ||
        (Number(a.floor) - Number(b.floor)) ||
        (Number(a.id) - Number(b.id))
      );
    }

    async function loadShippingSheet() {
      console.log('[Supabase] shipping_sheet select 요청 중...');
      const { data: rows, error } = await sb.from('shipping_sheet').select('*');
      logSb('select', 'shipping_sheet', error, rows);
      if (error) {
        // shipping_sheet 테이블을 아직 만들지 않았을 수도 있으므로 alert 대신
        // 출고표 탭 안에 안내 문구만 보여준다.
        shippingSheetError = error.message;
        shippingSheet = [];
        return;
      }
      shippingSheetError = null;
      shippingSheet = sortShippingRows((rows || []).map(r => ({ ...r, qty: roundQty(r.qty) })));
      if (shipEditId !== null && !shippingSheet.some(r => r.id === shipEditId)) shipEditId = null;
      pruneShipChecked();
    }

    function subscribeRealtime() {
      sb.channel('inventory-items-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'inventory_items' }, async (payload) => {
          console.log('[Realtime] inventory_items 변경 감지:', payload);
          await loadInventory();
          render();
          renderShipSearch();
          if (!photoBusy) renderPhotoReview();
        })
        .subscribe((status) => console.log('[Realtime] inventory_items 채널 상태:', status));

      sb.channel('inventory-logs-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'inventory_logs' }, async (payload) => {
          console.log('[Realtime] inventory_logs 변경 감지:', payload);
          await loadLogs();
          renderLogs();
        })
        .subscribe((status) => console.log('[Realtime] inventory_logs 채널 상태:', status));

      sb.channel('shipping-sheet-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'shipping_sheet' }, async (payload) => {
          console.log('[Realtime] shipping_sheet 변경 감지:', payload);
          await loadShippingSheet();
          if (shipEditId === null) renderShippingSheet(); // 수량 입력 중엔 다시 그리지 않음 (키패드 닫힘 방지)
        })
        .subscribe((status) => console.log('[Realtime] shipping_sheet 채널 상태:', status));
    }

    function showTab(name, btn) {
      document.querySelectorAll('.panel').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(name).classList.add('active');
      btn.classList.add('active');
      if (name === 'stats') { renderStats(); renderMonthlyStats(); }
      if (name === 'logs') renderLogs();
      if (name === 'ship') renderShippingSheet();
    }

    function getTodayDate() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function getAllFloors() {
      const floors = new Set();
      ['A', 'B', 'C'].forEach(col => {
        for (let can = 1; can <= 20; can++) {
          if (inv[col][can]) {
            Object.keys(inv[col][can]).forEach(f => floors.add(parseInt(f)));
          }
        }
      });
      return Array.from(floors).sort((a, b) => a - b);
    }

    function setEditMode() {
      document.getElementById('editFields').style.display = 'block';
      document.getElementById('editButtons').style.display = 'block';
      document.getElementById('addSection').style.display = 'block';
      document.getElementById('inSection').style.display = 'none';
      document.getElementById('outSection').style.display = 'none';
      document.getElementById('shipSection').style.display = 'none';
      document.getElementById('moveSection').style.display = 'none';
    }

    function openEditModal(col, can, floor, idx) {
      const item = inv[col][can][floor][idx];
      editingItem = { col, can, floor, idx, id: item.id };
      editingCan = { col, can };
      document.getElementById('modalTitle').textContent = `${col}열 칸${can} 상품 수정`;
      document.getElementById('modalName').value = item.n;
      document.getElementById('modalQty').value = fmtQty(item.q);
      document.getElementById('modalDate').value = item.d || getTodayDate();
      document.getElementById('modalExpDate').value = item.e || '';
      setEditMode();

      const floors = getAllFloors();
      const maxF = Math.max(...floors, 3, floor);
      const fs = document.getElementById('modalFloor');
      fs.innerHTML = '';
      for (let i = 1; i <= maxF; i++) {
        const o = document.createElement('option'); o.value = i; o.textContent = i + '층'; fs.appendChild(o);
      }
      fs.value = floor;

      const nfs = document.getElementById('newFloor');
      nfs.innerHTML = '';
      for (let i = 1; i <= Math.max(...floors, 3); i++) {
        const o = document.createElement('option'); o.value = i; o.textContent = i + '층'; nfs.appendChild(o);
      }
      document.getElementById('newName').value = '';
      document.getElementById('newQty').value = '';
      document.getElementById('newDate').value = '';
      document.getElementById('newExpDate').value = '';

      openModalUI();
    }

    function openAddModal(col, can) {
      editingItem = null;
      editingCan = { col, can };
      document.getElementById('modalTitle').textContent = `${col}열 칸${can} 상품 추가`;
      document.getElementById('editFields').style.display = 'none';
      document.getElementById('editButtons').style.display = 'none';
      document.getElementById('addSection').style.display = 'block';
      document.getElementById('inSection').style.display = 'none';
      document.getElementById('outSection').style.display = 'none';
      document.getElementById('shipSection').style.display = 'none';
      document.getElementById('moveSection').style.display = 'none';

      const floors = getAllFloors();
      const nfs = document.getElementById('newFloor');
      nfs.innerHTML = '';
      for (let i = 1; i <= Math.max(...floors, 3); i++) {
        const o = document.createElement('option'); o.value = i; o.textContent = i + '층'; nfs.appendChild(o);
      }
      document.getElementById('newName').value = '';
      document.getElementById('newQty').value = '';
      document.getElementById('newDate').value = '';
      document.getElementById('newExpDate').value = '';
      openModalUI();
    }

    function openAddModalFloor(col, can, floor) {
      openAddModal(col, can);
      document.getElementById('newFloor').value = floor;
    }

    // 모달 안에서 한 섹션만 보여준다 (입고/출고/이동/출고표입력 공통)
    function showOnlySection(sectionId) {
      document.getElementById('editFields').style.display = 'none';
      document.getElementById('editButtons').style.display = 'none';
      document.getElementById('addSection').style.display = 'none';
      ['inSection', 'outSection', 'shipSection', 'moveSection'].forEach(id => {
        document.getElementById(id).style.display = id === sectionId ? 'block' : 'none';
      });
    }

    function getEditingItem() {
      if (!editingItem) return null;
      const { col, can, floor, idx } = editingItem;
      return (inv[col] && inv[col][can] && inv[col][can][floor] && inv[col][can][floor][idx]) || null;
    }

    function showInModal() {
      showOnlySection('inSection');
      document.getElementById('inQty').value = '';
      document.getElementById('inDate').value = '';
      document.getElementById('inExpDate').value = '';
    }

    function cancelIn() {
      setEditMode();
    }

    async function confirmIn() {
      if (!editingItem) return;
      const qty = readQtyInput('inQty');
      if (qty === null) return alert('수량을 0보다 큰 숫자로 입력해주세요 (소수점 두 자리까지)');
      const { col, can, floor, idx, id } = editingItem;
      const date = document.getElementById('inDate').value || getTodayDate();
      const expDate = document.getElementById('inExpDate').value;
      const item = inv[col][can][floor][idx];
      const newQty = roundQty(item.q + qty);

      const updatePayload = { qty: newQty, in_date: date };
      if (expDate) updatePayload.exp_date = expDate;
      const { error: updErr } = await sb.from('inventory_items').update(updatePayload).eq('id', id);
      logSb('update', 'inventory_items', updErr, { id, ...updatePayload });
      if (updErr) { console.error('[Supabase] 입고 실패:', updErr); return alert('입고 오류: ' + updErr.message); }

      const logPayload = { type: '입고', col, can, floor, name: item.n, qty, date };
      const { error: logErr } = await sb.from('inventory_logs').insert(logPayload);
      logSb('insert', 'inventory_logs', logErr, logPayload);
      if (logErr) { console.error('[Supabase] 입고 로그 저장 실패:', logErr); return alert('로그 저장 오류: ' + logErr.message); }

      await loadInventory();
      await loadLogs();
      render();
      closeModal();
      alert('입고되었습니다!');
    }

    function showMoveModal() {
      if (!editingItem) return;
      showOnlySection('moveSection');

      const { col, can, floor } = editingItem;
      const mc = document.getElementById('moveCol');
      mc.innerHTML = ['A', 'B', 'C'].map(c => `<option value="${c}">${c}열</option>`).join('');
      mc.value = col;

      updateMoveCanOptions();
      document.getElementById('moveCan').value = can;

      const floors = getAllFloors();
      const maxF = Math.max(...floors, 3, floor);
      const mf = document.getElementById('moveFloor');
      mf.innerHTML = '';
      for (let i = 1; i <= maxF; i++) {
        const o = document.createElement('option'); o.value = i; o.textContent = i + '층'; mf.appendChild(o);
      }
      mf.value = floor;
    }

    function updateMoveCanOptions() {
      const col = document.getElementById('moveCol').value;
      const maxCan = COL_MAX[col];
      const sel = document.getElementById('moveCan');
      const keep = parseInt(sel.value);
      sel.innerHTML = '';
      for (let i = 1; i <= maxCan; i++) {
        const o = document.createElement('option'); o.value = i; o.textContent = i + '칸'; sel.appendChild(o);
      }
      if (keep && keep <= maxCan) sel.value = keep;
    }

    function cancelMove() {
      setEditMode();
    }

    async function confirmMove() {
      if (!editingItem) return;
      const { col: fromCol, can: fromCan, floor: fromFloor, idx, id } = editingItem;
      const item = inv[fromCol][fromCan][fromFloor][idx];

      const toCol = document.getElementById('moveCol').value;
      const toCan = parseInt(document.getElementById('moveCan').value);
      const toFloor = parseInt(document.getElementById('moveFloor').value);

      if (!toCan || !toFloor || toFloor < 1) return alert('올바른 위치를 선택해주세요');
      if (toCol === fromCol && toCan === fromCan && toFloor === fromFloor) return alert('같은 위치로는 이동할 수 없습니다');

      const destItems = (inv[toCol] && inv[toCol][toCan] && inv[toCol][toCan][toFloor]) || [];
      const existing = destItems.find(d => d.n === item.n);

      let merge = false;
      if (existing) {
        merge = confirm(`이동할 위치에 이미 "${item.n}"이(가) 있습니다. 수량을 합칠까요?\n(확인: 합치기 / 취소: 별도 항목으로 유지)`);
      }

      if (merge) {
        const mergedQty = roundQty(existing.q + item.q);
        const { error: updErr } = await sb.from('inventory_items').update({ qty: mergedQty }).eq('id', existing.id);
        logSb('update', 'inventory_items', updErr, { id: existing.id, qty: mergedQty });
        if (updErr) return alert('이동 오류: ' + updErr.message);

        const { error: delErr } = await sb.from('inventory_items').delete().eq('id', id);
        logSb('delete', 'inventory_items', delErr, { id });
        if (delErr) return alert('이동 오류: ' + delErr.message);
      } else {
        const { error: updErr } = await sb.from('inventory_items').update({ col: toCol, can: toCan, floor: toFloor }).eq('id', id);
        logSb('update', 'inventory_items', updErr, { id, col: toCol, can: toCan, floor: toFloor });
        if (updErr) return alert('이동 오류: ' + updErr.message);
      }

      const logPayload = { type: '이동', col: toCol, can: toCan, floor: toFloor, name: item.n, qty: item.q, date: getTodayDate(), from_col: fromCol, from_can: fromCan, from_floor: fromFloor };
      const { error: logErr } = await sb.from('inventory_logs').insert(logPayload);
      logSb('insert', 'inventory_logs', logErr, logPayload);
      if (logErr) return alert('로그 저장 오류: ' + logErr.message);

      await loadInventory();
      await loadLogs();
      render();
      closeModal();
      alert('이동되었습니다!');
    }

    // 출고 공통 처리: 재고 차감(차감 후 0이면 상품 삭제) + '출고' 로그 기록
    // 일반 출고와 출고표입력이 똑같은 규칙을 쓰도록 한 곳에 모아 둔다.
    // loc: { col, can, floor, id } (생략하면 모달에서 선택한 상품)
    async function applyOutflow(item, qty, loc = editingItem) {
      const { col, can, floor, id } = loc;
      const today = getTodayDate();
      const newQty = roundQty(item.q - qty);
      const depleted = newQty <= 0;

      if (depleted) {
        const { error } = await sb.from('inventory_items').delete().eq('id', id);
        logSb('delete', 'inventory_items', error, { id });
        if (error) return { error, depleted };
      } else {
        const { error } = await sb.from('inventory_items').update({ qty: newQty }).eq('id', id);
        logSb('update', 'inventory_items', error, { id, qty: newQty });
        if (error) return { error, depleted };
      }

      const logPayload = { type: '출고', col, can, floor, name: item.n, qty, date: today };
      const { error: logErr } = await sb.from('inventory_logs').insert(logPayload);
      logSb('insert', 'inventory_logs', logErr, logPayload);
      return { error: null, depleted, logErr };
    }

    function showOutModal() {
      const item = getEditingItem();
      if (!item) return;
      showOnlySection('outSection');
      document.getElementById('outStockInfo').textContent = `현재 재고: ${fmtQty(item.q)}개`;
      document.getElementById('outQty').value = '';
    }

    function cancelOut() {
      setEditMode();
    }

    async function confirmOut() {
      const item = getEditingItem();
      if (!item) return;
      const qty = readQtyInput('outQty');
      if (qty === null) return alert('출고 수량을 0보다 큰 숫자로 입력해주세요 (소수점 두 자리까지)');
      if (qty > item.q) return alert(`재고가 부족합니다 (현재 재고 ${fmtQty(item.q)}개)`);

      const { error, depleted, logErr } = await applyOutflow(item, qty);
      if (error) { console.error('[Supabase] 출고 실패:', error); return alert('출고 오류: ' + error.message); }

      // 재고 변경(update/delete)은 이미 성공했으므로, 로그 저장 성공 여부와 무관하게
      // 화면은 항상 최신 DB 상태로 갱신한다 (delete 완료 → loadInventory 완료 → render 순서 유지).
      await loadInventory();
      await loadLogs();
      render();
      closeModal();

      if (logErr) { console.error('[Supabase] 출고 로그 저장 실패:', logErr); return alert('로그 저장 오류: ' + logErr.message); }
      alert(depleted ? '출고되었습니다! (재고 소진으로 삭제됨)' : '출고되었습니다!');
    }

    function showShipModal() {
      const item = getEditingItem();
      if (!item) return;
      showOnlySection('shipSection');
      document.getElementById('shipStockInfo').textContent = `현재 재고: ${fmtQty(item.q)}개`;
      document.getElementById('shipQty').value = '';
    }

    function cancelShip() {
      setEditMode();
    }

    async function confirmShip() {
      const item = getEditingItem();
      if (!item) return;
      const qty = readQtyInput('shipQty');
      if (qty === null) return alert('출고표 수량을 0보다 큰 숫자로 입력해주세요 (소수점 두 자리까지)');
      if (qty > item.q) return alert(`재고가 부족합니다 (현재 재고 ${fmtQty(item.q)}개)`);

      const { col, can, floor, id } = editingItem;
      const result = await addToShippingSheet(item, qty, { col, can, floor, id });
      if (result.shipErr) return;
      closeModal();
      alertShipResult(result);
    }

    // 출고표입력 공통 처리 (모달 "출고표입력"과 출고표 탭 검색 추가가 같이 쓴다)
    // 출고표 기록 → 재고 차감(0이면 상품 삭제) → '출고' 로그 → 화면 갱신
    async function addToShippingSheet(item, qty, loc) {
      const { col, can, floor } = loc;

      // 1) 출고표에 먼저 기록한다. (재고가 0이 되어 상품이 삭제되어도 출고표 기록은 남아야 함)
      const shipPayload = { col, can, floor, name: item.n, qty, date: getTodayDate() };
      const { error: shipErr } = await sb.from('shipping_sheet').insert(shipPayload);
      logSb('insert', 'shipping_sheet', shipErr, shipPayload);
      if (shipErr) { console.error('[Supabase] 출고표 기록 실패:', shipErr); alert('출고표 기록 오류: ' + shipErr.message); return { shipErr }; }

      // 2) 재고 차감 + '출고' 로그 (기존 출고와 동일한 처리)
      const { error, depleted, logErr } = await applyOutflow(item, qty, loc);
      if (error) console.error('[Supabase] 출고표 등록 중 재고 차감 실패:', error);

      await loadInventory();
      await loadLogs();
      await loadShippingSheet();
      render();
      renderShippingSheet();
      renderShipSearch();
      return { error, depleted, logErr };
    }

    function alertShipResult({ error, depleted, logErr }) {
      if (error) return alert('출고표에는 기록됐지만 재고 차감에 실패했습니다: ' + error.message);
      if (logErr) { console.error('[Supabase] 출고표 출고 로그 저장 실패:', logErr); return alert('로그 저장 오류: ' + logErr.message); }
      alert(depleted ? '출고표에 등록되었습니다! (재고 소진으로 상품 삭제됨)' : '출고표에 등록되었습니다!');
    }

    let modalHistoryPushed = false;

    function openModalUI() {
      document.getElementById('editModal').classList.add('active');
      history.pushState({ appModal: true }, '');
      modalHistoryPushed = true;
    }

    function closeModal() {
      const wasActive = document.getElementById('editModal').classList.contains('active');
      document.getElementById('editModal').classList.remove('active');
      editingItem = null;
      editingCan = null;
      if (wasActive && modalHistoryPushed) {
        modalHistoryPushed = false;
        history.back();
      }
    }

    window.addEventListener('popstate', () => {
      if (document.getElementById('editModal').classList.contains('active')) {
        modalHistoryPushed = false;
        document.getElementById('editModal').classList.remove('active');
        editingItem = null;
        editingCan = null;
      }
    });

    async function saveItem() {
      if (!editingItem) return;
      const floor = parseInt(document.getElementById('modalFloor').value);
      const name = document.getElementById('modalName').value.trim();
      const qty = readQtyInput('modalQty');
      const date = document.getElementById('modalDate').value || getTodayDate();
      const expDate = document.getElementById('modalExpDate').value || null;
      if (!name) return alert('상품명을 입력해주세요');
      if (qty === null) return alert('수량을 0보다 큰 숫자로 입력해주세요 (소수점 두 자리까지)');
      const { id } = editingItem;

      const updatePayload = { floor, name, qty, in_date: date, exp_date: expDate };
      const { error } = await sb.from('inventory_items').update(updatePayload).eq('id', id);
      logSb('update', 'inventory_items', error, { id, ...updatePayload });
      if (error) { console.error('[Supabase] 상품 수정 실패:', error); return alert('저장 오류: ' + error.message); }

      await loadInventory();
      render();
      closeModal();
    }

    async function addNewItem() {
      if (!editingCan) return;
      const floor = parseInt(document.getElementById('newFloor').value);
      const name = document.getElementById('newName').value.trim();
      const qty = readQtyInput('newQty');
      const date = document.getElementById('newDate').value || getTodayDate();
      const expDate = document.getElementById('newExpDate').value || null;
      if (!name) return alert('상품명을 입력해주세요');
      if (qty === null) return alert('수량을 0보다 큰 숫자로 입력해주세요 (소수점 두 자리까지)');
      const { col, can } = editingCan;

      const insertPayload = { col, can, floor, name, qty, in_date: date, exp_date: expDate };

      logSb('insert', 'inventory_items', error, insertPayload);
      if (error) { console.error('[Supabase] 상품 추가 실패:', error); return alert('추가 오류: ' + error.message); }

      render();
      closeModal();
